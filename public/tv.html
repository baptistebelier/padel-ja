<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel JA — Écran TV</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja2">
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/tv.css">
</head>
<body data-look>
<div id="stage">
  <div class="deco"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
  <header class="tvh">
    <div class="tvh-l"><img id="logo" class="club" alt=""><div><div id="tName" class="t-name"></div><span id="tSub" class="tag"></span></div></div>
    <div class="tvh-r"><div id="viewTitle" class="view-title"></div><div id="clock" class="clock"></div><img src="/img/ja-r-rouge-blanc.png" class="ja-mark" alt="/R JA"></div>
  </header>
  <div class="views">
    <section class="view" id="v-bracket"><svg id="bLines" class="blines" width="1920" height="870"></svg><div id="bCards"></div></section>
    <section class="view" id="v-poules"><div id="poulesGrid" class="poules-grid"></div></section>
    <section class="view" id="v-schedule"><div id="schedGrid" class="sched-grid"></div></section>
    <section class="view" id="v-live"><div id="liveGrid" class="live-grid"></div><aside id="lastRes" class="last-res"></aside></section>
    <section class="view" id="v-standings"><div id="standGrid" class="stand-grid"></div></section>
    <section class="view" id="v-info"><div id="infoBox" class="info-box"></div></section>
    <section class="view" id="v-stats"><div id="statsBox" class="stats-box"></div></section>
    <section class="view" id="v-draw"><div id="drawBox" class="draw-box"></div></section>
  </div>
  <footer class="tvf"><div class="tick"><div id="tickIn" class="tick-in"></div></div></footer>
  <div id="waiting" class="waiting"><img src="/img/ja-r-rouge-blanc.png" alt="/R JA"><span>En attente du serveur Padel JA…</span></div>
</div>
<script src="/js/engine.js"></script>
<script src="/js/client.js"></script>
<script src="/js/tv.js"></script>
</body>
</html>
