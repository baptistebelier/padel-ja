<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/js/splash.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png?v=ja3">
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja3">
<title>Joueurs — /Pista</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/club/ds.css">
<link rel="stylesheet" href="/css/pista.css">
<script src="/js/theme.js"></script>
<script src="/js/donnees.js"></script>
<script src="/js/rail.js" defer></script>
<script src="/club/empilement.js" defer></script>
</head>
<body class="acct" data-page="joueurs">
<main class="page">
  <header class="phead">
    <div><span class="eyebrow">Mes joueurs</span><h1>Joueurs</h1></div>
    <div class="phead-act"><button class="btn" type="button" id="pexport"><svg class="pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Exporter</button></div>
  </header>
  <div class="grid g-2 ps-jgrid">
    <div class="ps-jmain">
      <div class="ps-jbar">
        <div class="psearch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="pq" type="search" name="recherche-joueur" role="searchbox" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="Nom, prénom ou licence…" aria-label="Chercher un joueur"></div>
        <div class="seg ps-jseg" role="tablist" aria-label="Liste"><button type="button" role="tab" data-l="mine" aria-selected="true">Mes tournois<span id="nMine"></span></button><button type="button" role="tab" data-l="base" aria-selected="false">Base de joueurs</button></div>
      </div>
      <section class="card ps-jlist"><div id="plist"><p class="muted">Chargement…</p></div><div id="pres" class="pres" hidden></div></section>
    </div>
    <aside class="card ps-pfiche" id="pfiche"><span class="eyebrow">Fiche joueur</span><p class="muted">Choisissez un joueur dans la liste pour voir son historique.</p></aside>
  </div>
</main>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const place = x => (x.place === 1 ? '1re' : x.placeLo && x.placeLo !== x.place ? `${x.placeLo}-${x.place}e` : x.place + 'e');
  const ini = p => esc(((p.last || '')[0] || '') + ((p.first || '')[0] || ''));
  let liste = 'mine', players = [], cur = null;
  // fidélité : citron « Fidèle » à partir de 3 tournois, sinon le nombre de tournois
  const fid = n => n >= 3 ? '<span class="r-pastille r-pastille--citron">Fidèle</span>' : `<span class="r-pastille">${n}</span>`;
  function loadPlayers() { Donnees.page('/api/club-players', d => {
    if (d.guest) { $('#plist').innerHTML = '<p class="muted">La base de joueurs est réservée aux comptes : <a href="/inscription">créez votre compte</a>.</p>'; return; }
    if (d.error) { $('#plist').innerHTML = `<p class="muted">${esc(d.error)}</p>`; return; }
    players = d.players || [];
    $('#nMine').textContent = players.length ? ' · ' + players.length : '';
    $('#plist').innerHTML = players.length ? `<p class="muted small">${players.length} joueur${players.length > 1 ? 's' : ''} sur ${d.tournaments} tournoi${d.tournaments > 1 ? 's' : ''} clôturé${d.tournaments > 1 ? 's' : ''}, classés par nombre de participations.</p>
      <div class="ptable"><div class="ph"><span>Joueur</span><span>Tournois</span><span>Victoires</span><span>Meilleur</span><span>Points</span><span>Fidélité</span></div>
      ${players.map(p => `<button type="button" class="pr" data-p="${p.id}" aria-pressed="false"><span><b>${esc(p.last)}</b> ${esc(p.first)}</span><span>${p.count}</span><span>${p.wins}</span><span>${p.best ? p.best + (p.best === 1 ? 're' : 'e') : '-'}</span><span>${p.points}</span><span>${fid(p.count)}</span></button>`).join('')}</div>`
      : '<p class="muted">Les joueurs apparaîtront ici dès que vous clôturerez un tournoi (onglet Tournoi, section Gestion).</p>';
    document.querySelectorAll('#plist [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
    if (!cur && location.hash.length <= 1 && players[0] && matchMedia('(min-width: 1024px)').matches) openPlayer(players[0].id);
  }, '#plist'); }
  loadPlayers();
  function setListe(l) {
    liste = l;
    document.querySelectorAll('.ps-jseg [data-l]').forEach(b => b.setAttribute('aria-selected', b.dataset.l === l));
    $('#plist').hidden = l !== 'mine'; $('#pres').hidden = l !== 'base';
    if (l === 'base' && !$('#pres').innerHTML) $('#pres').innerHTML = '<p class="muted small">Tapez au moins 2 lettres pour chercher dans toute la base /Pista (tous clubs).</p>';
  }
  document.querySelector('.ps-jseg').onclick = e => { const b = e.target.closest('[data-l]'); if (b) setListe(b.dataset.l); };
  let qt = null;
  $('#pq').oninput = e => {
    clearTimeout(qt); const q = e.target.value.trim();
    if (q.length < 2) { if (liste === 'base') $('#pres').innerHTML = ''; return; }
    setListe('base');
    qt = setTimeout(async () => {
      const d = await fetch('/api/players?q=' + encodeURIComponent(q)).then(r => r.json()).catch(() => ({ players: [] }));
      $('#pres').innerHTML = (d.players || []).map(p => `<button type="button" class="pr2" data-p="${p.id}"><b>${esc(p.last)}</b> ${esc(p.first)} <span>${p.licence ? 'Lic. ' + esc(p.licence) + ' · ' : ''}${p.club ? esc(p.club) + ' · ' : ''}${p.tournaments} tournoi(s)</span></button>`).join('')
        || (d.error ? `<p class="muted small">${esc(d.error)}</p>` : '<p class="muted small">Aucun joueur trouvé.</p>');
      document.querySelectorAll('#pres [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
    }, 200);
  };
  async function openPlayer(id) {
    const d = await fetch('/api/players/' + id).then(r => r.json());
    if (d.error) return alert(d.error);
    cur = id;
    document.querySelectorAll('[data-p]').forEach(el => el.setAttribute('aria-pressed', el.dataset.p === id));
    const p = d.player, h = d.history;
    const wins = h.filter(x => x.place === 1).length, best = h.length ? Math.min(...h.map(x => x.place)) : null;
    $('#pfiche').innerHTML = `<div class="ps-pfh"><i class="avatar ps-pav" aria-hidden="true">${ini(p)}</i><div><span class="eyebrow">Fiche joueur</span><h2>${esc(p.last)} ${esc(p.first)}</h2>
      <p class="muted small">${p.licence ? 'Licence ' + esc(p.licence) : 'Licence non renseignée'}${p.rank ? ' · classement ' + esc(p.rank) : ''}${p.club ? ' · ' + esc(p.club) : ''}</p></div></div>
      <div class="ps-month ps-pstats"><div class="ps-mstat"><b>${h.length}</b><span>tournoi${h.length > 1 ? 's' : ''}</span></div><div class="ps-mstat"><b>${wins}</b><span>victoire${wins > 1 ? 's' : ''}</span></div><div class="ps-mstat"><b>${best ? best + (best === 1 ? 're' : 'e') : '-'}</b><span>meilleur</span></div></div>
      <span class="ps-lbl">Historique</span>
      <div class="ps-hist">${h.map(x => `<div class="ps-hrow"><div><b>${esc(x.tournament)}</b><small>${x.date ? new Date(x.date).toLocaleDateString('fr-FR') + ' · ' : ''}${x.partner ? 'avec ' + esc(x.partner) : 'avec —'}${x.mine ? '' : ' · <em>autre club</em>'}</small></div><strong>${place(x)}</strong>${x.points == null ? '' : `<span class="r-pastille">${x.points} pts</span>`}</div>`).join('') || '<p class="muted small">Aucun tournoi clôturé.</p>'}</div>
      <div class="btns"><a class="btn" href="/app"><svg class="pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Inscrire à un tournoi</a></div>`;
    if (matchMedia('(max-width: 1023px)').matches) $('#pfiche').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  // export du tableau des joueurs (fichier CSV lisible par un tableur)
  $('#pexport').onclick = () => {
    if (!players.length) return alert('Aucun joueur à exporter pour l’instant.');
    const rows = [['Nom', 'Prénom', 'Tournois', 'Victoires', 'Meilleur', 'Points']].concat(players.map(p => [p.last, p.first, p.count, p.wins, p.best || '', p.points]));
    const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'joueurs.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  if (location.hash.length > 1) openPlayer(location.hash.slice(1));
})();
</script>
</body>
</html>
