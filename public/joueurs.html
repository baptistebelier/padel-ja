<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png?v=ja2">
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja2">
<title>Mes joueurs — RAM JA</title>
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/street.css">
<script src="/js/theme.js"></script>
<script src="/js/rail.js" defer></script>
</head>
<body class="acct" data-page="joueurs">
<main class="page">
  <header class="phead">
    <div><span class="eyebrow">Base de joueurs</span><h1>Mes <span class="band lime">joueurs</span></h1>
      <p>Les joueurs de vos tournois clôturés, et la recherche dans toute la base RAM JA (tous clubs).</p></div>
  </header>
  <section class="card">
    <span class="eyebrow">Recherche</span><h2>Trouver un joueur</h2>
    <div class="psearch"><input id="pq" type="search" name="recherche-joueur" role="searchbox" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="Nom, prénom ou licence…"><div id="pres" class="pres"></div></div>
  </section>
  <section class="card">
    <span class="eyebrow">Fidélité</span><h2>Les joueurs de mes tournois</h2>
    <div id="plist"><p class="muted">Chargement…</p></div>
  </section>
</main>
<div class="pmodal" id="pmodal" hidden><div class="pmodal-box" id="pbox"></div></div>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const place = x => (x.place === 1 ? '1er' : x.placeLo && x.placeLo !== x.place ? `${x.placeLo}-${x.place}e` : x.place + 'e');
  async function loadPlayers() {
    const d = await fetch('/api/club-players').then(r => r.json()).catch(() => ({}));
    if (d.guest) { $('#plist').innerHTML = '<p class="muted">La base de joueurs est réservée aux comptes : <a href="/inscription">créez votre compte</a>.</p>'; return; }
    if (d.error) { $('#plist').innerHTML = `<p class="muted">${esc(d.error)}</p>`; return; }
    $('#plist').innerHTML = d.players && d.players.length ? `<p class="muted small">${d.players.length} joueur(s) sur ${d.tournaments} tournoi(s) clôturé(s), classés par nombre de participations.</p>
      <div class="ptable"><div class="ph"><span>#</span><span>Joueur</span><span>Tournois</span><span>Victoires</span><span>Meilleur</span><span>Points</span></div>
      ${d.players.map((p, i) => `<div class="pr" data-p="${p.id}"><span>${i + 1}</span><span><b>${esc(p.last)}</b> ${esc(p.first)}</span><span>${p.count}</span><span>${p.wins}</span><span>${p.best ? p.best + (p.best === 1 ? 'er' : 'e') : '-'}</span><span>${p.points}</span></div>`).join('')}</div>`
      : '<p class="muted">Les joueurs apparaîtront ici dès que vous clôturerez un tournoi (onglet Tournoi, section Gestion).</p>';
    document.querySelectorAll('#plist [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
  }
  loadPlayers();
  let qt = null;
  $('#pq').oninput = e => {
    clearTimeout(qt); const q = e.target.value.trim();
    if (q.length < 2) { $('#pres').innerHTML = ''; return; }
    qt = setTimeout(async () => {
      const d = await fetch('/api/players?q=' + encodeURIComponent(q)).then(r => r.json()).catch(() => ({ players: [] }));
      $('#pres').innerHTML = (d.players || []).map(p => `<div class="pr2" data-p="${p.id}"><b>${esc(p.last)}</b> ${esc(p.first)} <span>${p.licence ? 'Lic. ' + esc(p.licence) + ' · ' : ''}${p.tournaments} tournoi(s)</span></div>`).join('')
        || (d.error ? `<p class="muted small">${esc(d.error)}</p>` : '<p class="muted small">Aucun joueur trouvé.</p>');
      document.querySelectorAll('#pres [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
    }, 200);
  };
  async function openPlayer(id) {
    const d = await fetch('/api/players/' + id).then(r => r.json());
    if (d.error) return alert(d.error);
    const p = d.player, h = d.history;
    const wins = h.filter(x => x.place === 1).length, best = h.length ? Math.min(...h.map(x => x.place)) : null, clubs = new Set(h.map(x => x.club)).size;
    $('#pbox').innerHTML = `<span class="eyebrow">Fiche joueur</span><h2>${esc(p.last)} ${esc(p.first)}</h2>
      <p class="muted">${p.licence ? 'Licence ' + esc(p.licence) : 'Licence non renseignée'}${p.rank ? ' · classement ' + esc(p.rank) : ''}</p>
      <div class="pk"><div><b>${h.length}</b><span>tournois</span></div><div><b>${wins}</b><span>victoires</span></div><div><b>${best ? best + (best === 1 ? 'er' : 'e') : '-'}</b><span>meilleur</span></div><div><b>${clubs}</b><span>clubs</span></div></div>
      <div class="ptable hist"><div class="ph"><span>Date</span><span>Tournoi</span><span>Club</span><span>Place</span><span>Pts</span><span>Partenaire</span></div>
      ${h.map(x => `<div class="pr"><span>${x.date ? new Date(x.date).toLocaleDateString('fr-FR') : ''}</span><span>${esc(x.tournament)} <i>${esc(x.category || '')}</i></span><span>${esc(x.club || '')}${x.mine ? '' : ' <i class="oc">autre club</i>'}</span><span><b>${place(x)}</b> / ${x.pairs}</span><span>${x.points == null ? '-' : x.points}</span><span>${esc(x.partner || '')}</span></div>`).join('')}</div>
      <button class="btn primary" id="pclose" style="margin-top:18px">Fermer</button>`;
    $('#pmodal').hidden = false;
    $('#pclose').onclick = () => { $('#pmodal').hidden = true; };
  }
  $('#pmodal').onclick = e => { if (e.target.id === 'pmodal') $('#pmodal').hidden = true; };
  if (location.hash.length > 1) openPlayer(location.hash.slice(1));
})();
</script>
</body>
</html>
