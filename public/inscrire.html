<title>S’inscrire — /Dojo</title>

<script>
/* Feuilles et scripts communs des trois applis : /club/… sur le domaine principal, racine sur coach. et club. */
(function () {
  var B = /^(coach|club)\./.test(location.hostname) ? '' : '/club', s = document.documentElement.style;
  s.setProperty('--mk', 'url(' + B + '/motifs/w30/padel-base.png)');
  s.setProperty('--ma', 'url(' + B + '/motifs/w30/padel-accent.png)');
  document.write('<link rel="stylesheet" href="' + B + '/ds.css"><script src="' + B + '/liste.js"><\/script>');
})();
</script>
<style>
  /* /Dojo · inscription en ligne : mêmes jetons et mêmes composants que la page de réservation (club/ds.css) */
  :root{--bg:#F1EDEE;--card:#FDFBFC;--card2:#EAE5E6;--field:#EAE5E6;--ink:#16191E;--fg:#16191E;--muted:#595D66;--off:#D9D1D3;--kick:#B0123F;--hero:#74102A;--accent-bg:#E0F50A;--on-accent-bg:#0B0B0B;--accent:#E0F50A;--accent2:#FF3D6B;--gut:16px}
  @media (prefers-color-scheme:dark){:root{--bg:#1A181A;--card:#252326;--card2:#2E2B30;--field:#201E20;--ink:#000;--fg:#F4F4F5;--muted:#C8C8CE;--off:#3C393E;--kick:#FF6B8E}}
  @media (max-width:700px){:root{--gut:10px}}
  *,*::before,*::after{box-sizing:border-box;border-radius:0}
  html{-webkit-text-size-adjust:100%;background:var(--c-bg)}
  body{margin:0;background:var(--c-bg);color:var(--c-text);font:15px/1.45 var(--f-body);position:relative;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
  button:disabled{cursor:default}
  p{margin:0}
  svg{display:block}
  .motif{position:fixed;inset:0;z-index:0;pointer-events:none}
  .motif::before,.motif::after{content:'';position:absolute;inset:0;-webkit-mask:var(--mk) 0 0/800px 800px repeat;mask:var(--mk) 0 0/800px 800px repeat;background:color-mix(in srgb,var(--c-text) 9%,transparent)}
  .motif::after{-webkit-mask-image:var(--ma);mask-image:var(--ma);background:color-mix(in srgb,var(--c-accent) 14%,transparent)}
  #m{position:relative;z-index:1}
  .ic{flex:none;fill:none;stroke:currentColor}
  :focus-visible{outline:3px solid var(--c-pink);outline-offset:2px}
  /* en-tête bord à bord, fond uni opaque (celui de l'en-tête des applis : --c-bg), fixe en haut, zone sûre de l'iPhone respectée ; son contenu suit la colonne de la page */
  .top{position:sticky;top:0;z-index:5;background:var(--c-bg);padding-top:env(safe-area-inset-top,0px)}
  .top-in{display:flex;align-items:center;gap:12px;min-height:64px;max-width:1100px;margin:0 auto;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) 10px max(var(--gut),env(safe-area-inset-left,0px))}
  .crest{display:grid;place-items:center;flex:none;width:44px;height:44px;background:var(--c-lime);color:var(--c-dark);border:var(--bw) solid var(--c-ink);font:400 17px/1 var(--f-display);text-transform:uppercase;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--accent2);overflow:hidden}
  .top h1{margin:0;font:400 24px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
  .top .sub{margin-top:2px;color:var(--c-muted);font-size:13px}
  .top-in>div:nth-child(2){min-width:0;flex:1 1 auto}
  #cp-zone{flex:none;margin-left:auto}
  .pad{display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;padding:16px var(--gut) 40px}
  .ti h2{margin:4px 0 0;font:400 26px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
  .ti p.lead{margin-top:8px;max-width:62ch}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  .r-card__head{flex-wrap:wrap}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px;padding:0;list-style:none}
  .meta li{display:flex;align-items:center;gap:8px;font-size:15px}
  .meta svg{color:var(--c-kick)}
  .meta .px{font:700 17px/1 var(--f-label)}
  .dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
  .dt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--c-surface-2);border:var(--bw) solid var(--c-ink);color:var(--c-text)}
  .dt b{font:700 17px/1.2 var(--f-label)}
  .dt small{font-size:13px;color:var(--c-muted)}
  .dt[aria-pressed=true]{background:var(--c-lime);color:var(--c-dark);box-shadow:var(--sh-sm)}
  .dt[aria-pressed=true] small{color:var(--c-dark)}
  .dt:disabled{opacity:.55}
  .tr{display:flex;flex-direction:column;gap:6px;padding:12px;margin:0 0 10px;background:var(--c-surface-2);border:var(--bw) solid var(--c-ink)}
  .trb{display:flex;flex-direction:column;gap:6px;width:100%;padding:0;text-align:left;color:inherit}
  .tr.off{opacity:.6}
  .choisir{display:flex;align-items:center;gap:8px;margin-top:4px;font:700 15px/1.1 var(--f-label);text-decoration:underline}
  .ins{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:var(--bw) solid color-mix(in srgb,var(--c-ink) 18%,transparent);display:grid;gap:8px}
  .ins li{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
  .ins .nm{font:700 15px/1.2 var(--f-label);overflow-wrap:anywhere}
  .ins small{margin-left:auto;color:inherit;opacity:.7;font-size:12px}
  .av{display:grid;place-items:center;flex:none;width:30px;height:30px;background:var(--c-lime);color:var(--c-dark);border:var(--bw) solid var(--c-ink);font:700 12px/1 var(--f-label);overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.anon{background:var(--c-surface);color:var(--c-muted)}
  .r-field>.lbl{font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
  .tr.moi{background:var(--c-lime);color:var(--c-dark);box-shadow:var(--sh-sm)}
  .tr .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .tr b{font:700 17px/1.2 var(--f-label)}
  .tr small{font-size:13px}
  .pts{display:flex;gap:4px;flex-wrap:wrap}
  .pts i{width:14px;height:14px;border:var(--bw) solid var(--c-ink);background:var(--c-surface)}
  .pts i.on{background:var(--c-ink)}
  .tr.moi .pts i.on{background:var(--c-dark);border-color:var(--c-dark)}
  .etat{padding:12px;border:var(--bw) solid var(--c-ink);background:var(--c-surface-2);margin:0 0 12px}
  .etat.ok{background:var(--c-green);color:var(--c-dark)}
  .fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .fm .w{grid-column:1/-1}
  .chk{display:flex;align-items:flex-start;gap:12px;font-size:13px;cursor:pointer}
  .pot{position:absolute;left:-9999px}
  .err{color:var(--c-pink);font-weight:600}
  .err:empty{display:none}
  .dg{margin-top:6px;color:var(--c-muted);font-size:13px}
  .vide-m{color:var(--c-muted)}
  .fin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
  .fin .ok{display:grid;place-items:center;width:72px;height:72px;background:var(--c-lime);border:var(--bw) solid var(--c-ink);box-shadow:var(--sh);color:var(--c-dark)}
  .fin .tx{margin-top:6px;font-size:14px}
  .hr{height:2px;margin:12px 0;background:var(--c-ink);border:0}
  @media (min-width:700px){.dates{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:900px){
    .top-in{min-height:76px;padding-top:14px;padding-bottom:14px}
    .crest{width:52px;height:52px;font-size:20px}
    .top h1{font-size:30px}
    .ti h2{font-size:34px}
    .grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:20px;align-items:start}
  }
  @media (max-width:899px){.grille{display:flex;flex-direction:column;gap:18px}}
</style>
</head>

<div class="motif" aria-hidden="true"></div>
<div id="m"><main class="pad"><p>Chargement…</p></main></div>
<script>
/* /Dojo · inscription en ligne à une séance collective ou une partie dirigée, sans compte (ou avec : bouton « Me connecter » de l'en-tête, /js/compte-public.js).
   Les inscrits sont affichés avec leur prénom et leur nom (choix de l'enseignant : le lien se partage en privé). Aucun e-mail, téléphone ni niveau détaillé n'arrive ici.
   Tout texte venu du serveur passe par e(). */
(function () {
  var root = document.getElementById('m'), parts = location.pathname.split('/').filter(Boolean), q = new URLSearchParams(location.search);
  var e = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var post = function (url, b) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Action impossible'); return d; }); }); };
  var cap = function (s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); };
  var jour = function (s, o) { return cap(new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', o || { weekday: 'long', day: 'numeric', month: 'long' })); };
  var ic = function (n, s) { return '<svg class="ic" width="' + s + '" height="' + s + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; };
  var initiales = function (n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase() || '·'; };
  var top = function (nom, sous) { return '<header class="top"><div class="top-in"><span class="crest">' + e(initiales(nom)) + '</span><div><h1>' + e(nom) + '</h1><p class="sub">' + e(sous) + '</p></div><div id="cp-zone">' + (window.ComptePublic ? window.ComptePublic.entete() : '') + '</div></div></header>'; };
  var page = function (nom, sous, corps) { root.innerHTML = top(nom, sous) + '<main class="pad">' + corps + '</main>'; };
  var titre = function (kick, t, lead) { return '<div class="ti"><span class="r-surtitre">' + e(kick) + '</span><h2>' + e(t) + '</h2>' + (lead ? '<p class="lead">' + e(lead) + '</p>' : '') + '</div>'; };
  var head = function (i, t) { return '<div class="r-card__head">' + (i ? ic(i, 20) : '') + '<b>' + e(t) + '</b></div>'; };
  var carte = function (h, c) { return '<div class="r-card">' + h + c + '</div>'; };
  /* photo illisible : retour aux initiales */
  root.addEventListener('error', function (ev) { var i = ev.target; if (i && i.tagName === 'IMG' && i.closest('.av')) i.replaceWith(document.createTextNode(i.dataset.i || '')); }, true);

  /* désinscription par le lien personnel reçu par e-mail */
  if (parts[1] === 'annuler') {
    var corps = '<div class="fin">' + titre('Inscription', 'Mon inscription') + carte('', '<p>Tu libères ta place : l’enseignant est prévenu et la liste d’attente avance.</p><p style="margin-top:14px"><button class="r-btn r-btn--full" id="a" type="button">' + ic('x', 18) + 'Me désinscrire</button></p><p class="err" id="er" role="alert"></p>') + '</div>';
    page('Inscription', '/Dojo · inscription en ligne', corps);
    document.getElementById('a').onclick = function () {
      post('/api/public/resa/desinscrire', { c: q.get('c'), p: q.get('p'), k: q.get('k'), d: q.get('d'), t: q.get('t') })
        .then(function () { page('Inscription', '/Dojo · inscription en ligne', '<div class="fin">' + titre('Inscription', 'Désinscription faite') + carte('', '<p>C’est fait : l’enseignant est prévenu.</p>') + '</div>'); })
        .catch(function (x) { document.getElementById('er').textContent = x.message; });
    };
    return;
  }
  var c = parts[1], pid = parts[2], tok = parts[3];
  var S = { data: null, d: null, tier: null, fiche: '', prefill: '', v: { p: '', n: '', t: '', em: '' }, conf: null, compteLu: false };
  var CPm = function () { return window.ComptePublic ? window.ComptePublic.moi() : null; };
  var moiOk = function () { var m = CPm(); return !!m && m.verifie !== false; };
  var fichesMoi = function () { return moiOk() ? CPm().fiches || [] : []; };
  var ficheChoisie = function () { return fichesMoi().filter(function (f) { return f.id === S.fiche; })[0] || null; };
  function charge() {
    fetch('/api/public/resa/collectif?c=' + encodeURIComponent(c) + '&p=' + encodeURIComponent(pid) + '&t=' + encodeURIComponent(tok))
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function (d) {
        S.data = d;
        var ok = (d.dates || []).filter(function (x) { return x.etat !== 'passe'; });
        S.d = ok.length === 1 ? ok[0].d : (ok.some(function (x) { return x.d === S.d; }) ? S.d : null);   // plusieurs dates : on en choisit une, rien n'est présélectionné
        var dt = (d.dates || []).filter(function (x) { return x.d === S.d; })[0];
        S.tier = dt && dt.tiers.length === 1 ? dt.tiers[0].id : (dt && dt.tiers.some(function (t) { return t.id === S.tier; }) ? S.tier : null);
        dessine(); demarreCompte();
      })
      .catch(function (x) { page('Inscription', '/Dojo · inscription en ligne', '<div class="fin">' + titre('Inscription', 'Lien introuvable') + carte('', '<p>' + e(x.message || 'Ce lien d’inscription n’est pas valable.') + '</p><p class="dg">Demande un nouveau lien à ton enseignant.</p>') + '</div>'); });
  }
  function demarreCompte() {
    if (S.compteLu || !window.ComptePublic) return;
    S.compteLu = true;
    window.ComptePublic.init({
      moiUrl: function () { return '/api/public/resa/moi-collectif?c=' + encodeURIComponent(c) + '&p=' + encodeURIComponent(pid) + '&t=' + encodeURIComponent(tok); },
      corps: function () { return { c: c, p: pid, t: tok, k: 'collectif' }; },
      chemin: function () { return location.pathname; },
      onMoi: function (m) { if (m && m.fiches && m.fiches.length === 1) S.fiche = m.fiches[0].id; if (!m) { S.fiche = ''; S.prefill = ''; } },
      onChange: function () { if (S.data && !S.conf) dessine(); }
    });
  }
  var tierDe = function (dt) { return dt ? dt.tiers.filter(function (t) { return t.id === S.tier; })[0] || null : null; };
  var rangeTxt = function (t, padel) { return (t.nom ? t.nom + ' · ' : '') + (padel ? 'Niveau ' + t.lo + ' à ' + t.hi : t.lo + ' à ' + t.hi); };
  var sous = function (d) { return d.coach + (d.club ? ' · ' + d.club : ''); };
  /* la liste des inscrits d'une fourchette, liste d'attente comprise : prénom, nom, et photo du compte /RAM s'il y en a une */
  function inscrits(t) {
    var l = t.inscrits || [];
    if (!l.length) return '<p class="dg" style="margin:8px 0 0">Aucun inscrit pour l’instant.</p>';
    return '<ul class="ins" aria-label="Inscrits">' + l.map(function (x) {
      var who = x.nom
        ? '<span class="av">' + (x.av ? '<img src="/api/public/resa/avatar-nv?c=' + encodeURIComponent(c) + '&p=' + encodeURIComponent(pid) + '&t=' + encodeURIComponent(tok) + '&i=' + encodeURIComponent(x.i) + '" alt="" data-i="' + e(initiales(x.nom)) + '">' : e(initiales(x.nom))) + '</span><span class="nm">' + e(x.nom) + '</span>'
        : '<span class="av anon">' + ic('user', 16) + '</span><span class="nm">Participant</span>';
      return '<li' + (x.a ? ' class="att"' : '') + '>' + who + (x.a ? '<small>liste d’attente</small>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  function dessine() {
    var d = S.data, kick = d.mode === 'cours' ? 'Séance collective' : 'Partie dirigée';
    if (S.conf) return fait();
    if (d.etat === 'coupe') return page(d.coach || 'Inscription', sous(d), '<div class="fin">' + titre(kick, d.titre) + carte(head('x', 'Inscriptions fermées'), '<p>Le lien d’inscription de cette séance est coupé. Contacte ton enseignant.</p>') + '</div>');
    if (d.etat === 'annule') return page(d.coach || 'Inscription', sous(d), '<div class="fin">' + titre(kick, d.titre) + carte(head('x', 'Séance annulée'), '<p>Cette séance est annulée. Contacte ton enseignant.</p>') + '</div>');
    var padel = d.sport === 'Padel', tous = d.dates || [], avenir = tous.filter(function (x) { return x.etat !== 'passe'; }), passe = !avenir.length;
    var dt = tous.filter(function (x) { return x.d === S.d; })[0];
    if (dt && dt.tiers.length === 1) S.tier = dt.tiers[0].id;   // une seule fourchette : pas de choix inutile
    var tier = tierDe(dt), un = dt && dt.tiers.length === 1;
    var meta = '<ul class="meta"><li>' + ic('cal', 18) + (tous.length > 1 ? 'Chaque ' + jour(tous[0].d, { weekday: 'long' }).toLowerCase() : e(jour((dt || tous[0]).d))) + ' · ' + e(d.time) + '</li><li>' + ic('clock', 18) + e(d.dur || '') + '</li>' + (d.place ? '<li>' + ic('pin', 18) + e(d.place) + '</li>' : '') + (d.price ? '<li class="px">' + e(d.price) + '</li>' : '') + '</ul>';
    var dates = tous.length > 1 ? '<div class="dates" role="group" aria-label="Dates">' + tous.map(function (x) {
      return '<button type="button" class="dt" data-d="' + x.d + '" aria-pressed="' + (x.d === S.d) + '"' + (x.etat === 'passe' ? ' disabled' : '') + '><b>' + e(jour(x.d, { weekday: 'short', day: 'numeric', month: 'short' })) + '</b><small>' + (x.etat === 'passe' ? 'séance passée' : x.etat === 'valide' ? 'validée' : 'ouverte') + '</small></button>';
    }).join('') + '</div>' : '';
    var autreValidee = dt && dt.tiers.some(function (x) { return x.valide; });
    var cartes = !dt ? '<p class="vide-m" role="status">Choisis d’abord une date.</p>' : dt.tiers.map(function (t) {
      var attente = t.complet || (autreValidee && !t.valide), etat = dt.etat === 'passe' ? 'Séance passée' : t.valide ? 'Validée' : t.complet ? 'Complet · liste d’attente' : autreValidee ? 'Liste d’attente' : t.restant + ' place' + (t.restant > 1 ? 's' : '') + ' restante' + (t.restant > 1 ? 's' : '');
      var corps = '<span class="l1"><b>' + e(rangeTxt(t, padel)) + '</b><small>' + e(etat) + '</small></span><span class="pts" aria-hidden="true">' + Array.from({ length: t.cap }, function (_, i) { return '<i class="' + (i < t.n ? 'on' : '') + '"></i>'; }).join('') + '</span><small>' + t.n + ' inscrit' + (t.n > 1 ? 's' : '') + ' sur ' + t.cap + (t.cap > t.min ? ' · minimum ' + t.min + ' pour valider' : '') + (t.attente ? ' · ' + t.attente + ' en attente' : '') + '</small>';
      var sel = !un && tier && tier.id === t.id;
      return '<div class="tr' + (sel || un ? ' moi' : '') + (dt.etat === 'passe' ? ' off' : '') + '">' + (un ? '<div class="trb">' + corps + '</div>' : '<button type="button" class="trb" data-tier="' + e(t.id) + '" aria-pressed="' + sel + '"' + (dt.etat === 'passe' ? ' disabled' : '') + '>' + corps + '<span class="choisir">' + (sel ? ic('check', 16) + 'Choisie' : (attente ? 'Rejoindre la liste d’attente' : 'M’inscrire dans cette fourchette')) + '</span></button>') + inscrits(t) + '</div>';
    }).join('');
    var info = carte(head('', kick + (d.sport ? ' · ' + d.sport : '') + (d.fmt ? ' · ' + d.fmt : '')), (d.body ? '<p style="margin-bottom:12px">' + e(d.body) + '</p>' : '') + meta + dates + '<p class="r-etiquette" style="margin:0 0 8px;color:var(--c-muted)">Fourchettes de niveau</p>' + cartes +
      '<p class="dg">La première fourchette qui atteint son minimum valide ' + (d.mode === 'cours' ? 'la séance' : 'la partie') + '. Les inscrits des autres passent en liste d’attente. Le tarif est à régler sur place.</p>');
    var form;
    if (passe) form = carte(head('clock', 'Séance passée'), '<p>Les inscriptions sont terminées pour cette séance.</p>');
    else if (!dt) form = carte(head('user', 'M’inscrire'), '<p class="vide-m">Choisis une date, puis ta fourchette.</p>');
    else if (!tier) form = carte(head('user', 'M’inscrire'), '<p class="vide-m">Touche la fourchette dans laquelle tu veux t’inscrire.</p>');
    else form = formulaire(d, dt, tier, padel);
    page(d.coach, sous(d), titre(kick, d.titre) + (window.ComptePublic ? window.ComptePublic.note() : '') + '<div class="grille"><div class="col">' + info + '</div><div class="col">' + form + '</div></div>');
    root.querySelectorAll('.dt').forEach(function (b) { b.onclick = function () { garde(); if (S.d !== b.dataset.d) { S.d = b.dataset.d; S.tier = null; } dessine(); }; });
    root.querySelectorAll('[data-tier]').forEach(function (b) { b.onclick = function () { garde(); S.tier = b.dataset.tier; dessine(); var f = document.getElementById('f'); if (f && f.scrollIntoView && matchMedia('(max-width:899px)').matches) f.scrollIntoView({ block: 'start' }); }; });
    root.querySelectorAll('[data-fiche]').forEach(function (b) { b.onclick = function () { garde(); S.fiche = b.dataset.fiche; S.prefill = ''; dessine(); }; });
    var fm = document.getElementById('f');
    if (fm) fm.onsubmit = function (x) {
      x.preventDefault();
      garde();
      if (fichesMoi().length > 1 && !S.fiche) { document.getElementById('er').textContent = 'Choisis pour qui tu t’inscris.'; return; }
      if (!fm.checkValidity()) { fm.reportValidity(); return; }
      var bt = document.getElementById('go'), val = function (i) { return document.getElementById(i).value; };
      bt.disabled = true;
      post('/api/public/resa/inscrire', { c: c, p: pid, t: tok, d: S.d, tier: S.tier, fiche: moiOk() ? S.fiche : '', prenom: val('p'), nom: val('n'), email: val('em'), tel: val('t'), site: val('site'), accord: document.getElementById('ac').checked })
        .then(function (r) { S.conf = r; dessine(); window.scrollTo(0, 0); })
        .catch(function (z) { bt.disabled = false; document.getElementById('er').textContent = z.message; });
    };
  }
  function formulaire(d, dt, tier, padel) {
    var v = S.v, fc = ficheChoisie(), l = fichesMoi();
    /* compte connecté dont l'adresse est prouvée : tout est prérempli, il ne reste qu'à confirmer */
    if (moiOk()) { if (fc && S.prefill !== fc.id) { var np = fc.nom.split(' '); v.p = np[0] || ''; v.n = np.slice(1).join(' '); if (fc.tel) v.t = fc.tel; S.prefill = fc.id; } v.em = CPm().email; if (!v.p && !v.n && !l.length) { var nm = String(CPm().nom || '').split(' '); v.p = nm[0] || ''; v.n = nm.slice(1).join(' '); } }
    var attente = tier.complet || dt.tiers.some(function (x) { return x.valide && x.id !== tier.id; });
    var qui = moiOk() && l.length > 1 ? '<div class="r-field w"><span class="lbl">Pour qui t’inscris-tu ?</span><div class="r-tabs r-tabs--full" role="group" aria-label="Pour qui">' + l.map(function (f) { return '<button type="button" data-fiche="' + e(f.id) + '" aria-pressed="' + (f.id === S.fiche) + '">' + e(f.nom) + '</button>'; }).join('') + '</div></div>' : '';
    return '<form class="r-card" id="f" novalidate>' + head('user', 'M’inscrire') +
      '<div class="etat' + (attente ? '' : ' ok') + '" role="status"><b>' + e(rangeTxt(tier, padel)) + '</b> · ' + (autreValideeTxt(dt, tier) || (tier.complet ? 'complet : liste d’attente' : tier.restant + ' place' + (tier.restant > 1 ? 's' : '') + ' restante' + (tier.restant > 1 ? 's' : ''))) + '</div>' +
      '<div class="fm">' + qui +
      '<div class="r-field"><label for="p">Prénom</label><input class="r-input" id="p" required autocomplete="given-name" value="' + e(v.p) + '"></div>' +
      '<div class="r-field"><label for="n">Nom</label><input class="r-input" id="n" required autocomplete="family-name" value="' + e(v.n) + '"></div>' +
      '<div class="r-field w"><label for="em">E-mail</label><input class="r-input" id="em" required type="email" autocomplete="email"' + (moiOk() ? ' readonly' : '') + ' value="' + e(v.em) + '"></div>' +
      '<div class="r-field w"><label for="t">Téléphone</label><input class="r-input" id="t" required type="tel" autocomplete="tel" value="' + e(v.t) + '"></div>' +
      '<div class="pot" aria-hidden="true"><label for="site">Site</label><input id="site" tabindex="-1" autocomplete="off"></div>' +
      '<label class="chk w"><input type="checkbox" class="r-check" id="ac" required><span>J’accepte que ' + e(d.coach) + ' conserve ces informations pour organiser ses séances. Je peux demander leur suppression à tout moment.</span></label>' +
      '<p class="dg w" style="margin:0">Ton prénom et ton nom apparaîtront dans la liste des inscrits de cette séance.</p>' +
      '<div class="w"><button class="r-btn r-btn--full" id="go" type="submit">' + ic('check', 18) + (attente ? 'Rejoindre la liste d’attente' : 'Je m’inscris') + '</button></div><p class="err w" id="er" role="alert"></p></div></form>';
  }
  var autreValideeTxt = function (dt, tier) { return dt.tiers.some(function (x) { return x.valide && x.id !== tier.id; }) ? 'une autre fourchette est déjà validée : liste d’attente' : ''; };
  function garde() { [['p', 'p'], ['n', 'n'], ['t', 't'], ['em', 'em']].forEach(function (i) { var x = document.getElementById(i[0]); if (x) S.v[i[1]] = x.value; }); }
  function fait() {
    var d = S.data, r = S.conf, wait = r.statut === 'wait';
    var msg = wait ? 'Tu es sur la liste d’attente : tu seras prévenu si une place se libère.' : r.statut === 'ok' ? 'C’est validé : tu es inscrit.' : 'Tu es inscrit. C’est validé dès que le minimum est atteint.';
    page(d.coach, sous(d), '<div class="fin"><div class="ok">' + ic('check', 40) + '</div>' +
      '<div><h2 style="margin:0;font:400 32px/1.05 var(--f-display);text-transform:uppercase">' + (wait ? 'Liste d’attente' : 'C’est noté') + '</h2><p class="tx">' + e(msg) + ' Un e-mail est parti à ' + e(r.mail) + '. ' + e(d.coach) + ' est prévenu.</p></div>' +
      carte(head('cal', r.titre), '<ul class="meta"><li>' + ic('cal', 18) + e(jour(r.d)) + ' · ' + e(r.h) + '</li>' + (d.dur ? '<li>' + ic('clock', 18) + e(d.dur) + '</li>' : '') + (d.place ? '<li>' + ic('pin', 18) + e(d.place) + '</li>' : '') + '</ul>' + (d.price ? '<p class="dg">Tarif à régler sur place : ' + e(d.price) + '</p>' : '')) +
      '<a class="r-btn r-btn--sec r-btn--full" href="' + e(r.annuler) + '">' + ic('x', 18) + 'Me désinscrire</a></div>');
  }
  charge();
})();
</script>
</body>
</html>
