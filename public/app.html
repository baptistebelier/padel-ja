<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel JA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png">
<title>Mes tournois — Padel JA /RAM</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/street.css">
<script src="/js/theme.js"></script>
<script src="/js/rail.js" defer></script>
</head>
<body class="acct" data-page="tournois">
<div class="guest" id="guestBar" hidden>Mode démo : vos tournois seront effacés dans 24 h. <a href="/inscription">Créer mon compte gratuitement</a></div>
<main class="page">
  <header class="phead">
    <div><span class="eyebrow" id="who">Juge-arbitre</span><h1>Mes <span class="band lime">tournois</span></h1></div>
    <div class="phead-act"><span id="plan" class="tag" hidden></span><a class="btn" href="/calendrier">Calendrier</a><a class="btn primary" href="#nouveau">+ Nouveau tournoi</a></div>
  </header>
  <section>
    <span class="eyebrow">En cours</span>
    <div class="tlist" id="tlist"><p class="muted">Chargement…</p></div>
  </section>
  <section class="card" id="nouveau">
    <span class="eyebrow">Nouveau tournoi</span>
    <h2 style="font-size:26px;margin-bottom:14px">Partir d'un modèle</h2>
    <div class="tpls" id="tpls"></div>
  </section>
  <section id="closedSec" hidden>
    <span class="eyebrow" id="clotures">Tournois clôturés</span>
    <div class="tlist" id="tclosed"></div>
  </section>
</main>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  fetch('/api/me').then(r => r.json()).then(d => {
    if (!d.user) return location.href = '/connexion';
    $('#who').textContent = d.user.guest ? 'Visiteur (démo)' : (d.user.name || d.user.email) + (d.user.club ? ' · ' + d.user.club : '');
    if (!d.user.guest) { $('#plan').hidden = false; $('#plan').textContent = d.user.planLabel; $('#plan').className = 'tag ' + (d.user.admin ? 'pink' : d.user.free ? 'lime' : 'ink'); }
    $('#guestBar').hidden = !d.user.guest;
  });
  async function create(body) {
    const r = await fetch('/api/tournaments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json(); if (d.id) location.href = '/t/' + d.id;
  }
  async function load() {
    const d = await fetch('/api/tournaments').then(r => r.json());
    const tpl = (t, mine) => `<button class="tpl" data-t="${t.id}"><span class="tag ${mine ? 'lime' : ''}">${mine ? 'Mon modèle' : esc(t.fields.category)}</span><b>${esc(t.name)}</b><small>${esc(t.desc || '')}</small></button>`;
    $('#tpls').innerHTML = `<button class="tpl blank" data-t=""><span class="tag ink">Vierge</span><b>Tournoi vierge</b><small>Je configure tout moi-même.</small></button>` +
      d.mine.map(t => tpl(t, true)).join('') + d.presets.map(t => tpl(t, false)).join('');
    document.querySelectorAll('.tpl').forEach(b => b.onclick = () => {
      const name = prompt('Nom du tournoi ?', b.dataset.t ? b.querySelector('b').textContent : 'Mon tournoi');
      if (name !== null) create({ name: name || 'Tournoi', template: b.dataset.t || undefined });
    });
    const fmt = s => s ? new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const card = t => `
      <article class="tcard">
        <div class="tc-top"><span class="tag">${esc(t.category || '')} · ${esc(t.gender || '')}</span><span class="st ${t.closed ? 'fin' : t.drawn ? 'on' : ''}">${t.closed ? 'Clôturé' : t.drawn ? `${t.done}/${t.matches} matchs` : 'Inscriptions'}</span></div>
        <h3>${esc(t.name || 'Sans nom')}</h3>${t.closed ? `<p class="closed-on">Clôturé le ${fmt(t.closedAt)}</p>` : ''}
        <p>${esc([fmt(t.dateStart), t.club, t.pairs + ' paires'].filter(Boolean).join(' · '))}</p>
        <div class="tc-act"><a class="btn primary sm" href="/t/${t.id}">Ouvrir</a><a class="btn ghost sm" href="/t/${t.id}/tv" target="_blank">Écran TV</a>
          <button class="btn ghost sm" data-dup="${t.id}">Dupliquer</button><button class="btn ghost sm danger" data-del="${t.id}">Supprimer</button></div>
      </article>`;
    const open = d.tournaments.filter(t => !t.closed), closed = d.tournaments.filter(t => t.closed).sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0));
    $('#tlist').innerHTML = open.length ? open.map(card).join('') : '<p class="muted">Aucun tournoi en cours : choisissez un modèle ci-dessus.</p>';
    $('#closedSec').hidden = !closed.length;
    $('#tclosed').innerHTML = closed.map(card).join('');
    document.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { const r = await fetch('/api/tournaments/' + b.dataset.dup + '/duplicate', { method: 'POST' }).then(r => r.json()); if (r.id) load(); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Supprimer définitivement ce tournoi ?')) { await fetch('/api/tournaments/' + b.dataset.del, { method: 'DELETE' }); load(); } });
  }
  load();

})();
</script>
</body>
</html>
