<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="/RAM JA">
<script src="/js/splash.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png?v=ja3">
<title>Mes tournois — /RAM JA</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja3">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/club/ds.css">
<link rel="stylesheet" href="/css/pista.css">
<script src="/js/theme.js"></script>
<script src="/js/donnees.js"></script>
<script src="/js/rail.js" defer></script>
<script src="/js/creation.js" defer></script>
</head>
<body class="acct" data-page="tournois">
<div class="guest" id="guestBar" hidden>Mode démo : vos tournois seront effacés dans 24 h. <a href="/inscription">Créer mon compte gratuitement</a></div>
<main class="page">
  <header class="phead">
    <div><span class="eyebrow" id="who">Juge-arbitre</span><h1>Mes <span class="band lime">tournois</span></h1></div>
    <div class="phead-act"><span id="plan" class="tag" hidden></span><a class="btn primary ps-new" href="#nouveau" aria-label="Nouveau tournoi">+ Nouveau tournoi</a></div>
  </header>
  <div id="psBento"></div>
</main>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  Donnees.lire('/api/me').then(d => {
    $('#who').textContent = d.user.guest ? 'Visiteur (démo)' : (d.user.name || d.user.email) + (d.user.club ? ' · ' + d.user.club : '');
    if (!d.user.guest) { $('#plan').hidden = false; $('#plan').textContent = d.user.planLabel; $('#plan').className = 'tag ' + (d.user.admin ? 'pink' : d.user.free ? 'lime' : 'ink'); }
    $('#guestBar').hidden = !d.user.guest;
  }).catch(() => {});
  const sportChoisi = () => { try { return localStorage.getItem('ja-sport') || ''; } catch (e) { return ''; } };
  const garderSport = v => { try { localStorage.setItem('ja-sport', v); } catch (e) {} };
  /* agencement de la maquette « Refonte /Pista » — segmenté Tous / Padel / Tennis,
     intercalaires À venir / En cours / Clôturés sur une liste, une ligne par tournoi, colonne de droite (modèles, ce mois-ci). */
  const pic = d => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = { tv: '<rect x="3" y="5" width="18" height="12"/><path d="M8 21h8M12 17v4"/>', dup: '<rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/>',
    del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', find: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', chev: '<path d="M9 6l6 6-6 6"/>', cal: '<rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/>', plus: '<path d="M12 5v14M5 12h14"/>' };
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  let psCol = location.hash === '#clotures' ? 'closed' : 'up', psQ = '';
  {
    const act = document.querySelector('.phead-act');
    act.insertAdjacentHTML('afterbegin', `<div class="seg ps-sport" role="tablist" aria-label="Sport">${['', 'Padel', 'Tennis'].map(v => `<button type="button" role="tab" data-sp="${v}" aria-selected="${sportChoisi() === v}">${v || 'Tous'}</button>`).join('')}</div><button type="button" class="sq ps-find" aria-label="Chercher un tournoi">${pic(IC.find)}</button><input type="search" class="ps-q" placeholder="Nom, club…" aria-label="Chercher un tournoi" hidden>`);
    act.querySelector('.ps-sport').addEventListener('click', e => { const b = e.target.closest('[data-sp]'); if (!b) return; garderSport(b.dataset.sp); act.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-selected', x === b)); load(); });
    const qi = act.querySelector('.ps-q');
    act.querySelector('.ps-find').onclick = () => { qi.hidden = !qi.hidden; if (!qi.hidden) qi.focus(); };
    qi.oninput = () => { psQ = qi.value.trim().toLowerCase(); load(); };
    const tb = document.getElementById('psBento');
    tb.outerHTML = (`<div class="r-bento ps-tbento"><div class="ps-tmain"><div class="r-itabs ps-itabs" role="tablist" id="psCols"></div><section class="card ps-tlist"><div class="rows" id="psRows"><p class="muted">Chargement…</p></div></section></div>
      <aside class="r-bento__side"><section class="card"><h2>${pic(IC.plus).replace('class="ic"', 'class="pic"')}Créer depuis un modèle</h2><div class="ps-tpls" id="psTpls"></div></section>
      <section class="card"><h2>${pic(IC.cal).replace('class="ic"', 'class="pic"')}Ce mois-ci</h2><div class="ps-month" id="psMonth"></div></section></aside></div>`);
    document.getElementById('psCols').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { psCol = b.dataset.c; load(); } });
    document.getElementById('psTpls').addEventListener('click', e => { const b = e.target.closest('[data-create]'); if (b && window.PadelCreate) PadelCreate.open(b.dataset.create); });
  }
  function psRender(up, live, closed, d) {
    const cols = [['up', 'À venir', up], ['live', 'En cours', live], ['closed', 'Clôturés', closed]];
    if (!cols.some(c => c[0] === psCol)) psCol = 'up';
    document.getElementById('psCols').innerHTML = cols.map(([k, l, a]) => `<button type="button" role="tab" data-c="${k}" aria-selected="${k === psCol}">${l} · ${a.length}</button>`).join('');
    const l = cols.find(c => c[0] === psCol)[2];
    const etat = t => t.closed ? (t.kind === 'animation' ? 'Terminée' : 'Clôturé') : t.drawn ? (t.kind === 'animation' ? 'Manche ' + t.rounds : t.done + '/' + t.matches + ' matchs') : 'Inscriptions';
    // blocs date : seul le prochain tournoi (le premier « À venir ») en citron
    document.getElementById('psRows').innerHTML = l.map((t, i) => {
      const dt = t.dateStart ? new Date(t.dateStart) : null;
      const tags = [t.type === 'interne' ? 'Interne' : t.kind === 'animation' ? 'Animation' : [t.category, t.gender].filter(Boolean).join(' '), etat(t)].filter(Boolean);
      return `<div class="row ps-trow"><div class="d${psCol === 'up' && i === 0 && dt ? ' ps-next1' : ''}"><b>${dt ? dt.getDate() : '–'}</b><span>${dt ? MOIS[dt.getMonth()] : 'date ?'}</span></div>
        <div class="ps-tname"><a href="/t/${t.id}"><strong>${esc(t.name || 'Sans nom')}</strong></a><small>${tags.map((x, i) => `<span class="tag ${i ? (t.drawn && !t.closed ? 'ps-live' : '') : ''}">${esc(x)}</span>`).join('')}<span class="ps-np">${t.kind === 'animation' ? t.players + ' joueurs' : t.pairs + (t.maxPairs ? '/' + t.maxPairs : '') + ' paires'}</span>${t.adjoint ? '<span class="ps-np">adjoint</span>' : ''}</small></div>
        <div class="ps-tact"><a class="btn sq" href="/t/${t.id}/tv" target="_blank" aria-label="Écran TV de ${esc(t.name || 'ce tournoi')}">${pic(IC.tv)}</a>${t.adjoint ? '' : `<button class="sq" data-dup="${t.id}" aria-label="Dupliquer">${pic(IC.dup)}</button><button class="sq" data-del="${t.id}" aria-label="Supprimer">${pic(IC.del)}</button>`}<a class="btn primary sm" href="/t/${t.id}">Ouvrir</a></div>
        <span class="ps-chev" aria-hidden="true">${pic(IC.chev)}</span></div>`;
    }).join('') || `<p class="empty">${psCol === 'up' ? 'Aucun tournoi prévu.' : psCol === 'live' ? 'Aucun tournoi en cours.' : 'Aucun tournoi clôturé.'}</p>`;
    const presets = (d.presets || []).slice(0, 6).map(p => ['officiels', p.name, (p.fields && p.fields.category) || 'Modèle']);
    document.getElementById('psTpls').innerHTML = presets.concat([['animation', 'Americano', 'Animation'], ['animation', 'Mexicano', 'Animation'], ['animation', 'Montée-descente', 'Animation'], ['interne', 'Tournoi interne', 'Club']])
      .map(([k, n, tag]) => `<button type="button" class="r-row" data-create="${k}"><span class="r-row__txt"><b>${esc(n)}</b><small>${esc(tag)}</small></span>${pic(IC.chev)}</button>`).join('');
    const m0 = new Date().toISOString().slice(0, 7), mois = d.tournaments.filter(t => (t.dateStart || '').slice(0, 7) === m0);
    document.getElementById('psMonth').innerHTML = `<div class="ps-mstat"><b>${mois.length}</b><span>tournoi${mois.length > 1 ? 's' : ''}</span></div><div class="ps-mstat"><b>${mois.reduce((n, t) => n + (t.pairs || 0), 0)}</b><span>paires inscrites</span></div>`;
  }
  function load() { Donnees.page('/api/tournaments', d => {
    // filtre par sport (chaque événement porte son sport et son type)
    if (d.tournaments && sportChoisi()) d.tournaments = d.tournaments.filter(t => (t.sport || 'Padel') === sportChoisi());
    // À venir : le plus proche d'abord ; En cours : le plus récent ; Clôturés : le plus récent
    const today = new Date().toISOString().slice(0, 10), started = t => t.drawn || (t.dateStart && t.dateStart <= today);
    const up = d.tournaments.filter(t => !t.closed && !started(t)).sort((x, y) => String(x.dateStart || '9').localeCompare(String(y.dateStart || '9')));
    const live = d.tournaments.filter(t => !t.closed && started(t)).sort((x, y) => (y.updated_at || 0) - (x.updated_at || 0));
    const closed = d.tournaments.filter(t => t.closed).sort((x, y) => (y.closedAt || 0) - (x.closedAt || 0));
    const f = l => psQ ? l.filter(t => [t.name, t.club, t.category].join(' ').toLowerCase().includes(psQ)) : l;
    psRender(f(up), f(live), f(closed), d);
    document.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { const r = await fetch('/api/tournaments/' + b.dataset.dup + '/duplicate', { method: 'POST' }).then(r => r.json()); if (r.id) load(); else alert(r.error || 'Duplication impossible pour l’instant.'); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Supprimer définitivement ce tournoi ?')) { await fetch('/api/tournaments/' + b.dataset.del, { method: 'DELETE' }); load(); } });
  }, '#psRows'); }
  load();

})();
</script>
</body>
</html>
