<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel JA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png">
<title>Mes tournois — Padel JA /RAM</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="dash">
<div class="guest" id="guestBar" hidden>Mode démo : vos tournois seront effacés dans 24 h. <a href="/inscription">Créer mon compte gratuitement</a></div>
<header class="nav"><a href="/" class="logo"><img src="/img/ram-logo-rouge-blanc.png" alt="/RAM"><b>Padel JA</b></a>
  <div class="nav-r"><span id="who"></span><span id="plan" class="tag" hidden></span><a href="/admin" id="adminLink" class="btn ghost sm" hidden>Admin</a><a href="/deconnexion" class="btn ghost sm">Déconnexion</a></div></header>
<main class="wrap">
  <h1 class="h1">Mes <span class="band lime">tournois</span></h1>
  <section class="newt">
    <span class="eyebrow">Nouveau tournoi</span>
    <h2>Partir d'un modèle</h2>
    <div class="tpls" id="tpls"></div>
  </section>
  <section>
    <span class="eyebrow">En cours</span>
    <div class="tlist" id="tlist"><p class="muted">Chargement…</p></div>
  </section>
  <section id="closedSec" hidden>
    <span class="eyebrow">Tournois clôturés</span>
    <div class="tlist" id="tclosed"></div>
  </section>
  <section id="playersSec">
    <span class="eyebrow">Joueurs</span>
    <h2>Les joueurs <span class="band lime">de mes tournois</span></h2>
    <div class="psearch"><input id="pq" type="search" name="recherche-joueur" role="searchbox" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="Rechercher un joueur (nom, prénom, licence) dans toute la base Padel JA…"><div id="pres" class="pres"></div></div>
    <div id="plist"><p class="muted">Chargement…</p></div>
  </section>
</main>
<div class="pmodal" id="pmodal" hidden><div class="pmodal-box" id="pbox"></div></div>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  fetch('/api/me').then(r => r.json()).then(d => {
    if (!d.user) return location.href = '/connexion';
    $('#who').textContent = d.user.guest ? 'Visiteur (démo)' : (d.user.name || d.user.email);
    if (!d.user.guest) { $('#plan').hidden = false; $('#plan').textContent = d.user.planLabel; $('#plan').className = 'tag ' + (d.user.admin ? 'pink' : d.user.free ? 'lime' : 'ink'); }
    $('#adminLink').hidden = !d.user.admin;
    $('#guestBar').hidden = !d.user.guest;
  });
  async function create(body) {
    const r = await fetch('/api/tournaments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json(); if (d.id) location.href = '/t/' + d.id;
  }
  async function load() {
    const d = await fetch('/api/tournaments').then(r => r.json());
    const tpl = (t, mine) => `<button class="tpl" data-t="${t.id}"><span class="tag ${mine ? 'lime' : ''}">${mine ? 'Mon modèle' : esc(t.fields.category)}</span><b>${esc(t.name)}</b><small>${esc(t.desc || '')}</small></button>`;
    $('#tpls').innerHTML = `<button class="tpl blank" data-t=""><span class="tag ink">Vierge</span><b>Tournoi vierge</b><small>Je configure tout moi-même.</small></button>` +
      d.mine.map(t => tpl(t, true)).join('') + d.presets.map(t => tpl(t, false)).join('');
    document.querySelectorAll('.tpl').forEach(b => b.onclick = () => {
      const name = prompt('Nom du tournoi ?', b.dataset.t ? b.querySelector('b').textContent : 'Mon tournoi');
      if (name !== null) create({ name: name || 'Tournoi', template: b.dataset.t || undefined });
    });
    const fmt = s => s ? new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const card = t => `
      <article class="tcard">
        <div class="tc-top"><span class="tag">${esc(t.category || '')} · ${esc(t.gender || '')}</span><span class="st ${t.closed ? 'fin' : t.drawn ? 'on' : ''}">${t.closed ? 'Clôturé' : t.drawn ? `${t.done}/${t.matches} matchs` : 'Inscriptions'}</span></div>
        <h3>${esc(t.name || 'Sans nom')}</h3>${t.closed ? `<p class="closed-on">Clôturé le ${fmt(t.closedAt)}</p>` : ''}
        <p>${esc([fmt(t.dateStart), t.club, t.pairs + ' paires'].filter(Boolean).join(' · '))}</p>
        <div class="tc-act"><a class="btn primary sm" href="/t/${t.id}">Ouvrir</a><a class="btn ghost sm" href="/t/${t.id}/tv" target="_blank">Écran TV</a>
          <button class="btn ghost sm" data-dup="${t.id}">Dupliquer</button><button class="btn ghost sm danger" data-del="${t.id}">Supprimer</button></div>
      </article>`;
    const open = d.tournaments.filter(t => !t.closed), closed = d.tournaments.filter(t => t.closed).sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0));
    $('#tlist').innerHTML = open.length ? open.map(card).join('') : '<p class="muted">Aucun tournoi en cours : choisissez un modèle ci-dessus.</p>';
    $('#closedSec').hidden = !closed.length;
    $('#tclosed').innerHTML = closed.map(card).join('');
    document.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { const r = await fetch('/api/tournaments/' + b.dataset.dup + '/duplicate', { method: 'POST' }).then(r => r.json()); if (r.id) load(); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Supprimer définitivement ce tournoi ?')) { await fetch('/api/tournaments/' + b.dataset.del, { method: 'DELETE' }); load(); } });
  }
  load();

  /* ---------- joueurs : fidélité, recherche, fiche ---------- */
  const place = x => (x.place === 1 ? '🏆 1er' : x.placeLo && x.placeLo !== x.place ? `${x.placeLo}-${x.place}e` : x.place + 'e');
  async function loadPlayers() {
    const d = await fetch('/api/club-players').then(r => r.json()).catch(() => ({}));
    if (d.guest) { $('#playersSec').hidden = true; return; }
    if (d.error) { $('#plist').innerHTML = `<p class="muted">${esc(d.error)}</p>`; return; }
    $('#plist').innerHTML = d.players && d.players.length ? `<p class="muted small">${d.players.length} joueur(s) sur ${d.tournaments} tournoi(s) clôturé(s), classés par nombre de participations.</p>
      <div class="ptable"><div class="ph"><span>#</span><span>Joueur</span><span>Tournois</span><span>Victoires</span><span>Meilleur</span><span>Points</span></div>
      ${d.players.map((p, i) => `<div class="pr" data-p="${p.id}"><span>${i + 1}</span><span><b>${esc(p.last)}</b> ${esc(p.first)}</span><span>${p.count}</span><span>${p.wins}</span><span>${p.best ? p.best + (p.best === 1 ? 'er' : 'e') : '-'}</span><span>${p.points}</span></div>`).join('')}</div>`
      : '<p class="muted">Les joueurs apparaîtront ici dès que vous clôturerez un tournoi (onglet Tournoi, section Gestion).</p>';
    document.querySelectorAll('#plist [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
  }
  loadPlayers();
  let qt = null;
  $('#pq').oninput = e => {
    clearTimeout(qt); const q = e.target.value.trim();
    if (q.length < 2) { $('#pres').innerHTML = ''; return; }
    qt = setTimeout(async () => {
      const d = await fetch('/api/players?q=' + encodeURIComponent(q)).then(r => r.json()).catch(() => ({ players: [] }));
      $('#pres').innerHTML = (d.players || []).map(p => `<div class="pr2" data-p="${p.id}"><b>${esc(p.last)}</b> ${esc(p.first)} <span>${p.licence ? 'Lic. ' + esc(p.licence) + ' · ' : ''}${p.tournaments} tournoi(s)</span></div>`).join('')
        || (d.error ? `<p class="muted small">${esc(d.error)}</p>` : '<p class="muted small">Aucun joueur trouvé.</p>');
      document.querySelectorAll('#pres [data-p]').forEach(el => el.onclick = () => openPlayer(el.dataset.p));
    }, 200);
  };
  async function openPlayer(id) {
    const d = await fetch('/api/players/' + id).then(r => r.json());
    if (d.error) return alert(d.error);
    const p = d.player, h = d.history;
    const wins = h.filter(x => x.place === 1).length, best = h.length ? Math.min(...h.map(x => x.place)) : null, clubs = new Set(h.map(x => x.club)).size;
    $('#pbox').innerHTML = `<span class="eyebrow">Fiche joueur</span><h2>${esc(p.last)} ${esc(p.first)}</h2>
      <p class="muted">${p.licence ? 'Licence ' + esc(p.licence) : 'Licence non renseignée'}${p.rank ? ' · classement ' + esc(p.rank) : ''}</p>
      <div class="pk"><div><b>${h.length}</b><span>tournois</span></div><div><b>${wins}</b><span>victoires</span></div><div><b>${best ? best + (best === 1 ? 'er' : 'e') : '-'}</b><span>meilleur</span></div><div><b>${clubs}</b><span>clubs</span></div></div>
      <div class="ptable hist"><div class="ph"><span>Date</span><span>Tournoi</span><span>Club</span><span>Place</span><span>Pts</span><span>Partenaire</span></div>
      ${h.map(x => `<div class="pr"><span>${x.date ? new Date(x.date).toLocaleDateString('fr-FR') : ''}</span><span>${esc(x.tournament)} <i>${esc(x.category || '')}</i></span><span>${esc(x.club || '')}${x.mine ? '' : ' <i class="oc">autre club</i>'}</span><span><b>${place(x)}</b> / ${x.pairs}</span><span>${x.points == null ? '-' : x.points}</span><span>${esc(x.partner || '')}</span></div>`).join('')}</div>
      <button class="btn primary" id="pclose" style="margin-top:18px">Fermer</button>`;
    $('#pmodal').hidden = false;
    $('#pclose').onclick = () => { $('#pmodal').hidden = true; };
  }
  $('#pmodal').onclick = e => { if (e.target.id === 'pmodal') $('#pmodal').hidden = true; };
})();
</script>
</body>
</html>
