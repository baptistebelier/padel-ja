<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="/RAM JA">
<script src="/js/splash.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app-icon-180.png?v=ja2">
<title>Mes tournois — /RAM JA</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja2">
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/street.css">
<link rel="stylesheet" href="/css/neo.css">
<script src="/js/theme.js"></script>
<script src="/js/rail.js" defer></script>
<script src="/js/creation.js" defer></script>
</head>
<body class="acct" data-page="tournois">
<div class="guest" id="guestBar" hidden>Mode démo : vos tournois seront effacés dans 24 h. <a href="/inscription">Créer mon compte gratuitement</a></div>
<main class="page">
  <header class="phead">
    <div><span class="eyebrow" id="who">Juge-arbitre</span><h1>Mes <span class="band lime">tournois</span></h1></div>
    <div class="phead-act"><span id="plan" class="tag" hidden></span><label class="ufilter" style="margin:0">Sport<select id="fsport" aria-label="Filtrer par sport"><option value="">Tous</option><option>Padel</option><option>Tennis</option></select></label><a class="btn" href="/calendrier">Calendrier</a><a class="btn primary" href="#nouveau">+ Nouveau tournoi</a></div>
  </header>
  <div class="tboard">
    <section><div class="tcol-h"><span class="eyebrow">À venir</span><span class="tag" id="nUp">0</span></div><div class="tlist" id="tup"><p class="muted">Chargement…</p></div></section>
    <section><div class="tcol-h"><span class="eyebrow">En cours</span><span class="tag" id="nLive">0</span></div><div class="tlist" id="tlist"></div></section>
    <section><div class="tcol-h"><span class="eyebrow" id="clotures">Clôturés</span><span class="tag" id="nDone">0</span></div><div class="tlist" id="tclosed"></div></section>
  </div>
</main>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  fetch('/api/me').then(r => r.json()).then(d => {
    if (!d.user) return location.href = '/connexion';
    $('#who').textContent = d.user.guest ? 'Visiteur (démo)' : (d.user.name || d.user.email) + (d.user.club ? ' · ' + d.user.club : '');
    if (!d.user.guest) { $('#plan').hidden = false; $('#plan').textContent = d.user.planLabel; $('#plan').className = 'tag ' + (d.user.admin ? 'pink' : d.user.free ? 'lime' : 'ink'); }
    $('#guestBar').hidden = !d.user.guest;
  });
  const sportChoisi = () => { try { return localStorage.getItem('ja-sport') || ''; } catch (e) { return ''; } };
  const garderSport = v => { try { localStorage.setItem('ja-sport', v); } catch (e) {} };
  const TYPES = { tournoi: 'Tournoi', animation: 'Animation', interne: 'Tournoi interne' };
  async function load() {
    const d = await fetch('/api/tournaments').then(r => r.json());
    // filtre par sport (chaque événement porte son sport et son type)
    const fs0 = document.getElementById('fsport'); if (fs0 && !fs0.dataset.pret) { fs0.dataset.pret = 1; fs0.value = sportChoisi(); fs0.onchange = () => { garderSport(fs0.value); load(); }; }
    if (d.tournaments && sportChoisi()) d.tournaments = d.tournaments.filter(t => (t.sport || 'Padel') === sportChoisi());
    const fmt = s => s ? new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const card = t => `
      <article class="tcard">
        <div class="tc-top"><span class="tag ${t.kind === 'animation' ? 'lime' : ''}">${esc([t.sport || 'Padel', TYPES[t.type] || (t.kind === 'animation' ? 'Animation' : 'Tournoi'), t.type === 'interne' ? '' : t.category].filter(Boolean).join(' · '))}</span><span class="st ${t.closed ? 'fin' : t.drawn ? 'on' : ''}">${t.closed ? (t.kind === 'animation' ? 'Terminée' : 'Clôturé') : t.drawn ? (t.kind === 'animation' ? `Manche ${t.rounds}` : `${t.done}/${t.matches} matchs`) : 'Inscriptions'}</span></div>
        <h3>${esc(t.name || 'Sans nom')}</h3>${t.adjoint ? '<p class="closed-on">Vous êtes juge-arbitre adjoint</p>' : ''}${t.closed ? `<p class="closed-on">Clôturé le ${fmt(t.closedAt)}</p>` : ''}
        <p>${esc([fmt(t.dateStart), t.club, t.kind === 'animation' ? t.players + ' joueurs' : t.pairs + ' paires'].filter(Boolean).join(' · '))}</p>
        <div class="tc-act"><a class="btn primary sm" href="/t/${t.id}">Ouvrir</a><a class="btn ghost sm" href="/t/${t.id}/tv" target="_blank">Écran TV</a>
          ${t.adjoint ? '' : `<button class="btn ghost sm" data-dup="${t.id}">Dupliquer</button><button class="btn ghost sm danger" data-del="${t.id}">Supprimer</button>`}</div>
      </article>`;
    // À venir : le plus proche d'abord ; En cours : le plus récent ; Clôturés : le plus récent
    const today = new Date().toISOString().slice(0, 10), started = t => t.drawn || (t.dateStart && t.dateStart <= today);
    const up = d.tournaments.filter(t => !t.closed && !started(t)).sort((x, y) => String(x.dateStart || '9').localeCompare(String(y.dateStart || '9')));
    const live = d.tournaments.filter(t => !t.closed && started(t)).sort((x, y) => (y.updated_at || 0) - (x.updated_at || 0));
    const closed = d.tournaments.filter(t => t.closed).sort((x, y) => (y.closedAt || 0) - (x.closedAt || 0));
    const fill = (id, n, l, none) => { $(id).innerHTML = l.length ? l.map(card).join('') : `<p class="muted small">${none}</p>`; $(n).textContent = l.length; };
    fill('#tup', '#nUp', up, 'Aucun tournoi prévu.');
    fill('#tlist', '#nLive', live, 'Aucun tournoi en cours.');
    fill('#tclosed', '#nDone', closed, 'Aucun tournoi clôturé.');
    document.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { const r = await fetch('/api/tournaments/' + b.dataset.dup + '/duplicate', { method: 'POST' }).then(r => r.json()); if (r.id) load(); else blocked(r); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Supprimer définitivement ce tournoi ?')) { await fetch('/api/tournaments/' + b.dataset.del, { method: 'DELETE' }); load(); } });
  }
  load();

})();
</script>
</body>
</html>
