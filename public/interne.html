<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A0C">
<link rel="icon" type="image/png" href="/img/favicon.png?v=ja2">
<title>Tournoi interne — /RAM JA</title>
<link rel="stylesheet" href="/css/ram.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/street.css">
<script src="/js/theme.js"></script>
<script src="/js/interne.js"></script>
<script src="/js/adjoints.js" defer></script>
<script src="/js/encours.js" defer></script>
<style>
/* Tournoi interne : réglages, participants, tableau à élimination sur plusieurs semaines */
.in-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.in-row label { flex: 1 1 160px; }
.in-p { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); margin-top: 6px; min-width: 0; }
.in-p .n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.in-p .club { font-size: 12px; color: var(--ui-text-mut); }
.in-p select { width: auto; flex: none; }
.ib2 { border: 0; background: transparent; color: var(--ui-text-mut); cursor: pointer; padding: 6px 8px; border-radius: 8px; font: inherit; }
.ib2:hover { background: var(--ui-surface); color: var(--ui-text); }
.in-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.in-add input { flex: 1 1 200px; }
.in-tab { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.in-col { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
.in-col h3 { font-family: var(--label); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-text-mut); margin: 0 0 4px; }
.in-col .fin { font-size: 12px; color: var(--ui-text-mut); }
.in-m { border: 2px solid var(--ui-border); border-radius: var(--ui-r-sm); background: var(--ui-surface-2); padding: 8px 10px; cursor: pointer; text-align: left; font: inherit; color: var(--ui-text); width: 100%; }
.in-m:hover { border-color: var(--ui-accent-line); }
.in-m .j { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.in-m .j.w { font-weight: 800; }
.in-m .j.l { opacity: .55; }
.in-m .st { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--ui-surface); }
.in-m.pending { border-color: #E3A33A; } .in-m.pending .st { background: #E3A33A; color: #111; }
.in-m.contest { border-color: var(--ui-accent2, #E0284A); } .in-m.contest .st { background: var(--ui-accent2, #E0284A); color: #fff; }
.in-m.bye { opacity: .5; cursor: default; }
.in-fins { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.in-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.in-modal > div { background: var(--ui-surface); color: var(--ui-text); border-radius: 14px; padding: 18px; width: min(460px, 100%); display: grid; gap: 12px; }
.in-modal label.chk { display: flex; align-items: center; gap: 10px; flex-direction: row; }
.in-modal label.chk input { width: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ui-text); color: var(--ui-surface); padding: 12px 18px; border-radius: 10px; z-index: 99; font-weight: 600; max-width: calc(100vw - 32px); }
.in-places li { padding: 4px 0; }
/* arbre d'un tableau, comme la feuille FFT : un trait par joueur, les branches réunissent les deux joueurs d'un match */
.ab-w { overflow-x: auto; padding: 4px 0 10px; }
.ab-h, .ab { display: grid; grid-template-columns: repeat(var(--c), minmax(150px, 1fr)); min-width: calc(var(--c) * 150px); }
.ab-h span { font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-text-mut); padding: 0 6px 6px; }
.ab { grid-template-rows: repeat(var(--l), 48px); }
.ab-s { position: relative; display: block; min-width: 0; background: none; border: 0; padding: 0; margin: 0; font: inherit; font-weight: 400; text-transform: none; letter-spacing: normal; box-shadow: none; border-radius: 0; color: var(--ui-text); text-align: left; min-height: 0; }
.ab-s::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid color-mix(in srgb, var(--ui-text) 55%, transparent); }
.ab-s.ab-up::after { content: ''; position: absolute; right: 0; top: 50%; height: 100%; border-right: 1.5px solid color-mix(in srgb, var(--ui-text) 55%, transparent); }
.ab-n { position: absolute; left: 6px; right: 10px; bottom: 50%; padding-bottom: 3px; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13.5px; }
.ab-n .nm { overflow: hidden; text-overflow: ellipsis; }
.ab-i { position: absolute; left: 6px; right: 10px; top: 50%; padding-top: 3px; font-size: 11.5px; color: var(--ui-text-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-cl { margin-left: auto; font-size: 11px; color: var(--ui-text-mut); flex: none; }
.ab-ts { flex: none; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--ui-accent-text, #E0284A); color: var(--ui-accent-text, #E0284A); font-size: 10px; font-weight: 800; line-height: 1; }
.ab-s.w .nm { font-weight: 800; }
.ab-s.l .nm { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }
.ab-s.q .nm { font-style: italic; color: var(--ui-text-mut); }
.ab-s.att .ab-i { color: #C77D0A; font-weight: 700; }
.ab-s.ct .ab-i { color: var(--ui-accent-text, #E0284A); font-weight: 700; }
.ab-s.ab-x { visibility: hidden; }
.ab-s.ab-fin .nm { font-weight: 800; color: var(--ui-accent-text, #E0284A); }
button.ab-s { cursor: pointer; }
button.ab-s:hover::before, button.ab-s:focus-visible::before { border-top-color: var(--ui-accent-text, #E0284A); border-top-width: 2.5px; }
/* poules et programme */
.in-poules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.in-poule { padding: 12px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); display: grid; gap: 8px; align-content: start; }
.in-poule h3 { margin: 0; }
.in-pt { width: 100%; border-collapse: collapse; font-size: 13px; }
.in-pt th { text-align: left; font-size: 11px; color: var(--ui-text-mut); font-weight: 700; padding: 2px 4px; }
.in-pt td { padding: 4px; border-top: 1px solid var(--ui-border); }
.in-pt tr.qual td { font-weight: 800; }
.in-pt tr.qual td:first-child { color: var(--ui-accent-text, #E0284A); }
.in-pm { display: grid; gap: 4px; }
.in-pm button, .in-pg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; width: 100%; text-align: left; border: 1px solid var(--ui-border); border-radius: 8px; background: var(--ui-surface); color: var(--ui-text); font: inherit; font-size: 13px; padding: 6px 8px; cursor: pointer; }
.in-pm button small, .in-pg small { color: var(--ui-text-mut); font-size: 11.5px; }
.in-pm button.att { border-color: #E3A33A; } .in-pm button.ct { border-color: var(--ui-accent-text, #E0284A); } .in-pm button.ok span { font-weight: 700; }
.in-pg { margin-top: 4px; } .in-pg b { min-width: 46px; }
.in-jour { margin: 14px 0 4px; font-size: 14px; text-transform: capitalize; }
.in-al { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 2px solid #E3A33A; background: color-mix(in srgb, #E3A33A 12%, transparent); margin-bottom: 8px; }
.in-al p { margin: 0; font-size: 13px; }
/* tableaux successifs : une carte par tableau, ses sections les unes sous les autres */
.in-sec + .in-sec { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--ui-border); }
.in-sec > h4 { margin: 0 0 8px; font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-accent-text); }
.in-m .ts { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: var(--ui-accent, #E0284A); color: #fff; margin-left: 6px; }
.in-m .j.q span:first-child { font-style: italic; color: var(--ui-text-mut); }
.in-st { display: grid; gap: 8px; }
.in-st .in-strow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; padding: 8px 10px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); }
.in-st .in-strow b { flex: 1 1 140px; }
.in-st .in-strow label { flex: 0 1 150px; }
.in-p .cl { width: 88px; }
.in-fmt { font-size: 13px; color: var(--ui-text-mut); }
</style>
</head>
<body class="acct" data-page="tournois">
<main class="page" id="app"><p class="muted">Chargement…</p></main>
<script>
(function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const tid = location.pathname.split('/')[2], base = '/api/t/' + tid;
  let S = null, membres = [], club = true, ouvert = null, espace = null;
  /* liste déroulante des participants : adhérents du club (reliés à leur fiche), puis joueurs de la base /RAM JA */
  (window.RamSuggQ = window.RamSuggQ || []).push({
    match: el => el.hasAttribute('data-in-joueur'),
    filtre: false,
    source: async t => {
      const f = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(), pris = new Set(((S && S.int && S.int.players) || []).flatMap(p => p.ks || []));
      const l = membres.filter(m => !pris.has(m.k) && (!t || f(m.n).includes(f(t)))).map(m => ({ id: 'k:' + m.k, v: m.n, l: 'Adhérent · ' + [m.compte ? 'Compte /RAM' : 'Fiche sans compte', m.niv, m.lic ? 'lic. ' + m.lic : ''].filter(Boolean).join(' · '), d: { k: m.k }, pp: 1, ph: m.ph, ml: m.ml }));
      if (t.length >= 2) {
        const d = await fetch('/api/players?q=' + encodeURIComponent(t)).then(r => r.json()).catch(() => ({}));
        (d.players || []).filter(p => p.source !== 'club' && !(p.membres || []).some(x => x.c === espace)).forEach(p => l.push({ id: 'p:' + p.id, v: [p.first, p.last].filter(Boolean).join(' '), l: ['Joueur /RAM JA', p.club, p.rank, p.licence ? 'lic. ' + p.licence : ''].filter(Boolean).join(' · '), d: { p }, pp: 1, ph: p.photo, ml: p.mail }));
      }
      return l;
    }
  });
  /* la personne choisie dans la liste ; sinon le nom tapé, s'il ne désigne qu'un adhérent */
  const quiEst = inp => {
    if (!inp) return { n: '', k: null };
    const n = inp.value.trim(), it = inp._sugg;
    if (it && it.v === n) return { n, k: it.d && it.d.k ? it.d.k : null };
    const l = membres.filter(m => m.n.toLowerCase() === n.toLowerCase());
    if (l.length > 1) return { n, doublon: true };
    return { n, k: l[0] ? l[0].k : null };
  };
  document.head.appendChild(Object.assign(document.createElement('script'), { src: '/js/rail.js', defer: true }));
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
  async function send(type, payload) {
    const r = await fetch(base + '/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, payload: payload || {} }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { toast(d.error || 'Action refusée'); return false; }
    return true;
  }
  const I = () => S.int, nom = id => Int.nomDe(I(), id) || '…';
  const dateFr = d => (d ? d.split('-').reverse().join('/') : '');

  const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}</option>`;
  /* format de match (formats FFT 1 à 7 au tennis) et structure : tableau unique ou tableaux successifs par classement */
  function formatStructure() {
    const i = I(), tire = Int.tire(i), joue = Int.allMatches(i).some(m => m.w && !m.bye), tennis = i.sport === 'Tennis';
    const fmts = tennis ? Object.keys(Int.FORMATS).filter(f => i.simple || Int.FORMATS[f].pd) : [];
    const st = brouillon || i.struct || [], rep = Int.repartition(Object.assign({}, i, { struct: st }));
    const ech = cur => Int.ECHELONS.map(e => opt(e, e, cur)).join('');
    const formule = `<label>Formule<select id="in-mode" ${tire ? 'disabled' : ''}>${opt('tableaux', 'Tableaux à élimination directe', i.mode)}${opt('poules', 'Poules, puis tableau final', i.mode)}${opt('tmc', 'Tournoi multi-chances (TMC)', i.mode)}</select></label>`;
    const prog = `<h3 style="margin:14px 0 6px">Déroulement</h3>
      <label class="chk" style="display:flex;flex-direction:row;gap:10px;align-items:center"><input type="checkbox" id="in-prog" style="width:auto" ${i.prog ? 'checked' : ''}>Matchs programmés par le juge-arbitre (jour, heure, terrain)</label>
      <p class="muted small">${i.prog ? 'Les joueurs sont prévenus de chaque programmation. Les limites de parties par jour, les repos et les horaires sont vérifiés (art. 13 et 14).' : 'Sinon, les joueurs organisent leurs matchs avant la date limite de chaque tour.'}</p>
      ${i.prog ? `<div class="in-row"><label>Terrains (séparés par des virgules)<input id="in-terr" value="${esc((i.terrains || []).join(', '))}" placeholder="Court 1, Court 2, Court 3"></label><label>Catégorie<select id="in-cat">${Object.keys(Int.CATEGORIES).map(k => opt(k, Int.CATEGORIES[k], i.categorie)).join('')}</select></label></div>` : ''}`;
    if (i.mode !== 'tableaux') {
      const c = i.pcfg || {}, rp = Int.repartitionPoules(i), n = Math.max(1, +c.n || 1);
      const corps = i.mode === 'tmc'
        ? `<p class="muted small">Tableau principal de 32 joueurs au plus ; les perdants de chaque tour sont reversés dans un tableau de classement. Chacun joue le même nombre de matchs et est classé de 1 à ${i.players.length || 'n'} (art. 51 bis). Pas de consolante.</p>`
        : `<div class="in-row"><label>Nombre de poules<input type="number" min="1" max="26" id="in-pn" value="${esc(c.n)}" ${tire ? 'disabled' : ''}></label><label>Qualifiés par poule<input type="number" min="1" max="3" id="in-pq" value="${esc(c.q)}" ${tire ? 'disabled' : ''}></label>
          <label>Joueurs en poules<select id="in-pmax" ${tire ? 'disabled' : ''}>${opt('', 'Tous', c.max || '')}${Int.ECHELONS.slice(0, -1).map(e => opt(e, 'Jusqu’à ' + e, c.max || '')).join('')}</select></label></div>
          <p class="muted small">${rp.poules.length} en poules (${Math.floor(rp.poules.length / n)} à ${Math.ceil(rp.poules.length / n)} par poule, 6 au plus), ${rp.direct.length} directement au tableau final. Une tête de série par poule ; le 2e d’une poule est placé dans l’autre moitié du tableau que le 1er.</p>`;
      return `<section class="card"><span class="eyebrow">Format et formule</span><h2>Comment se joue le tournoi</h2>
        <label>Format des matchs<select id="in-fmt" ${joue ? 'disabled' : ''}>${tennis ? fmts.map(f => opt(f, 'Format ' + f + ' : ' + Int.FORMATS[f].l, i.format)).join('') + opt(0, 'Score libre', i.format) : opt(0, 'Score libre (padel)', 0)}</select></label>
        ${formule}${corps}${prog}</section>`;
    }
    const lignes = st.map((x, k) => `<div class="in-strow"><b>Tableau ${k + 1} · ${rep[k].length} joueur${rep[k].length > 1 ? 's' : ''}</b>
        <label>Classement le plus haut<select data-st-max="${k}" ${tire ? 'disabled' : ''}>${ech(x.max)}</select></label>
        <label>Qualifiés sortants<input type="number" min="1" max="16" data-st-q="${k}" value="${esc(x.q)}" ${tire ? 'disabled' : ''}></label>
        ${tire ? '' : `<button type="button" class="ib2" data-st-del="${k}">Retirer</button>`}</div>`).join('');
    return `<section class="card"><span class="eyebrow">Format et tableaux</span><h2>Comment se joue le tournoi</h2>
      <label>Format des matchs<select id="in-fmt" ${joue ? 'disabled' : ''}>${tennis ? fmts.map(f => opt(f, 'Format ' + f + ' : ' + Int.FORMATS[f].l, i.format)).join('') + opt(0, 'Score libre', i.format) : opt(0, 'Score libre (padel)', 0)}</select></label>
      <p class="in-fmt">${Int.FORMATS[i.format] ? `Les scores saisis sont vérifiés, par exemple ${esc(Int.FORMATS[i.format].ex)}.${i.simple ? '' : ' En double, le point décisif est obligatoire (art. 11).'}` : 'Le score est un texte libre.'}</p>
      ${formule}
      ${tennis ? `<h3 style="margin:14px 0 6px">Tableaux</h3>
      <p class="muted small">${st.length ? 'Chaque joueur entre dans le tableau de son classement ; les qualifiés de chaque tableau rejoignent le suivant, jusqu’au tableau final. Un tableau qui qualifie plusieurs joueurs est découpé en sections, une par qualifié.' : 'Un seul tableau pour tous. Pour des tableaux successifs par classement (NC à 30/1, puis 30 à 15/1…), ajoutez un tableau.'}</p>
      <div class="in-st">${lignes}<div class="in-strow"><b>${st.length ? 'Tableau final' : 'Tableau'} · ${rep[st.length].length} joueur${rep[st.length].length > 1 ? 's' : ''}${st.length ? ' + ' + st[st.length - 1].q + ' qualifié' + (st[st.length - 1].q > 1 ? 's' : '') : ''}</b><span class="muted small">${st.length ? 'les mieux classés' : 'tous les participants'}</span></div></div>
      ${tire ? '<p class="muted small">Le tableau est tiré : annulez le tirage pour changer la structure.</p>' : `<div class="in-row" style="margin-top:10px">${st.length < 4 ? '<button type="button" class="btn ghost" id="in-st-add">Ajouter un tableau</button>' : ''}${brouillon ? '<button type="button" class="btn" id="in-st-save">Enregistrer les tableaux</button>' : ''}</div>`}` : ''}${prog}</section>`;
  }
  let brouillon = null;   // structure en cours de modification, pas encore enregistrée
  function reglages() {
    const t = S.tournament, i = I(), tire = Int.tire(i);
    return `<section class="card"><span class="eyebrow">Réglages</span><h2>Le tournoi</h2>
      <form id="in-set" class="grid">
        <div class="in-row"><label>Nom<input name="name" value="${esc(t.name)}" maxlength="80"></label><label>Club<input name="club" value="${esc(t.club)}" maxlength="80"></label></div>
        <div class="in-row"><label>Sport<select name="sport" ${tire ? 'disabled' : ''}><option ${i.sport === 'Tennis' ? 'selected' : ''}>Tennis</option><option ${i.sport === 'Padel' ? 'selected' : ''}>Padel</option></select></label>
        <label>Tableau<select name="simple" ${tire ? 'disabled' : ''}><option value="1" ${i.simple ? 'selected' : ''}>Simple</option><option value="0" ${i.simple ? '' : 'selected'}>Double</option></select></label>
        <label>Début<input type="date" name="dateStart" value="${esc(t.dateStart || '')}"></label><label>Fin prévue<input type="date" name="dateEnd" value="${esc(t.dateEnd || '')}"></label></div>
        <label>Règlement et organisation (visibles par les joueurs dans /RAM Club)<textarea name="regle" rows="6" maxlength="8000" placeholder="Format des matchs, balles, réservation des courts, délais, forfaits…">${esc(i.regle || '')}</textarea></label>
        <label class="chk" style="display:flex;flex-direction:row;gap:10px;align-items:center"><input type="checkbox" name="pub" style="width:auto" ${t.regMode === 'none' ? '' : 'checked'}>Publier sur /RAM Club (tableau, règlement et participants pour les adhérents)</label>
        <div><button class="btn">Enregistrer</button></div>
      </form>${club ? '' : '<p class="muted small">Le club de ce tournoi n’a pas encore d’espace /RAM Club : le tournoi ne pourra pas y être publié.</p>'}</section>`;
  }
  function participants() {
    const i = I(), tire = Int.tire(i), tennis = i.sport === 'Tennis';
    // classement FFT : il range les joueurs dans leur tableau et désigne les têtes de série
    const clSel = p => tennis ? `<select class="cl" data-cl="${p.id}" aria-label="Classement de ${esc(p.n)}">${opt('', '—', p.cl || '')}${Int.ECHELONS.map(e => opt(e, e, p.cl || '')).join('')}${p.cl && !Int.ECHELONS.includes(p.cl) ? opt(p.cl, p.cl, p.cl) : ''}</select>` : '';
    const tri = i.players.slice().sort((a, b) => Int.rang(b.cl) - Int.rang(a.cl) || a.n.localeCompare(b.n, 'fr'));
    const ligne = p => `<div class="in-p"><span class="n">${esc(p.n)}${(p.ks || []).length ? '' : ' <span class="club">· hors /RAM Club</span>'}</span>${tire ? `${p.cl ? `<span class="club">${esc(p.cl)}</span>` : ''}${Int.tsDe(i, p.id) ? `<span class="club">Tête de série ${Int.tsDe(i, p.id)}</span>` : ''}` : `${clSel(p)}<select data-seed="${p.id}" aria-label="Tête de série choisie à la main"><option value="0">TS auto</option>${Array.from({ length: Math.min(16, i.players.length) }, (_, k) => `<option value="${k + 1}" ${+p.seed === k + 1 ? 'selected' : ''}>TS ${k + 1}</option>`).join('')}</select><button class="ib2" data-del="${p.id}" aria-label="Retirer ${esc(p.n)}">Retirer</button>`}</div>`;
    return `<section class="card"><span class="eyebrow">Participants · ${i.players.length}</span><h2>${i.simple ? 'Joueurs' : 'Équipes'}</h2>
      ${tennis && !tire && i.players.length ? '<p class="muted small">Les têtes de série suivent le classement (le quart du tableau final, une par section). « TS » les fixe à la main.</p>' : ''}

      d.innerHTML = `<div role="dialog" aria-label="Consolante"><h2 style="margin:0">Consolante</h2><p class="muted small">Cochez les joueurs battus qui ont accepté de jouer la consolante.</p>
        <form id="in-cf" class="grid">${Int.consolables(i).map(p => `<label class="chk"><input type="checkbox" name="c" value="${p.id}" ${dans.has(p.id) ? 'checked' : ''}>${esc(p.n)}${p.cl ? ' · ' + esc(p.cl) : ''}</label>`).join('')}
        <div class="in-row"><button class="btn">Tirer la consolante</button>${C ? '<button type="button" class="btn ghost" id="in-cdel">Supprimer la consolante</button>' : ''}<button type="button" class="btn ghost" id="in-cx">Fermer</button></div></form></div>`;
      document.body.appendChild(d);
      const close = () => d.remove();
      d.querySelector('#in-cx').onclick = close;
      d.addEventListener('click', e => { if (e.target === d) close(); });
      if (d.querySelector('#in-cdel')) d.querySelector('#in-cdel').onclick = async () => { if (await send('int/consol', { ids: [] })) { close(); toast('Consolante supprimée'); } };
      d.querySelector('#in-cf').onsubmit = async e => { e.preventDefault(); const ids = [...d.querySelectorAll('input[name=c]:checked')].map(x => x.value); if (await send('int/consol', { ids })) { close(); toast('Consolante tirée'); } };
    });
    on('#in-draw', async () => { if (await send('int/draw')) toast('Tableau tiré : chaque joueur est prévenu de son adversaire'); });
    on('#in-redraw', async () => { if (confirm('Refaire le tirage ? Les joueurs seront prévenus de leur nouvel adversaire.') && await send('int/draw', { reseed: true })) toast('Nouveau tirage'); });
    on('#in-undraw', async () => { if (confirm('Annuler le tirage ?')) await send('int/undraw'); });
    on('#in-close', async () => { if (!confirm('Clôturer le tournoi ? Plus aucun résultat ne pourra être saisi.')) return; const r = await fetch('/api/tournaments/' + tid + '/close', { method: 'POST' }); if (r.ok) toast('Tournoi clôturé'); });
    on('#in-reopen', async () => { const r = await fetch('/api/tournaments/' + tid + '/reopen', { method: 'POST' }); if (r.ok) toast('Tournoi rouvert'); });
  }
  const es = new EventSource(base + '/events');
  es.onmessage = ev => { const d = JSON.parse(ev.data); if (d.state) { S = d.state; render(); } };
  fetch(base + '/membres').then(r => r.json()).then(d => { membres = d.membres || []; espace = d.espace || null; club = d.club !== false; render(); }).catch(() => {});
})();
</script>
</body>
</html>
