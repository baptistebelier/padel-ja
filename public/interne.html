<html lang="fr">
<head>

<style>
/* Tournoi interne : réglages, participants, tableau à élimination sur plusieurs semaines */
.in-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.in-row label { flex: 1 1 160px; }
.in-p { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); margin-top: 6px; min-width: 0; }
.in-p .n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.in-p .club { font-size: 12px; color: var(--ui-text-mut); }
.in-p select { width: auto; flex: none; }
.ib2 { border: 0; background: transparent; color: var(--ui-text-mut); cursor: pointer; padding: 6px 8px; border-radius: 8px; font: inherit; }
.ib2:hover { background: var(--ui-surface); color: var(--ui-text); }
.in-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.in-add input { flex: 1 1 200px; }
.in-tab { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.in-col { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
.in-col h3 { font-family: var(--label); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-text-mut); margin: 0 0 4px; }
.in-col .fin { font-size: 12px; color: var(--ui-text-mut); }
.in-m { border: 2px solid var(--ui-border); border-radius: var(--ui-r-sm); background: var(--ui-surface-2); padding: 8px 10px; cursor: pointer; text-align: left; font: inherit; color: var(--ui-text); width: 100%; }
.in-m:hover { border-color: var(--ui-accent-line); }
.in-m .j { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.in-m .j.w { font-weight: 800; }
.in-m .j.l { opacity: .55; }
.in-m .st { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--ui-surface); }
.in-m.pending { border-color: #E3A33A; } .in-m.pending .st { background: #E3A33A; color: #111; }
.in-m.contest { border-color: var(--ui-accent2, #E0284A); } .in-m.contest .st { background: var(--ui-accent2, #E0284A); color: #fff; }
.in-m.bye { opacity: .5; cursor: default; }
.in-fins { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.in-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.in-modal > div { background: var(--ui-surface); color: var(--ui-text); border-radius: 14px; padding: 18px; width: min(460px, 100%); display: grid; gap: 12px; }
.in-modal label.chk { display: flex; align-items: center; gap: 10px; flex-direction: row; }
.in-modal label.chk input { width: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ui-text); color: var(--ui-surface); padding: 12px 18px; border-radius: 10px; z-index: 99; font-weight: 600; max-width: calc(100vw - 32px); }
.in-places li { padding: 4px 0; }
/* arbre d'un tableau, comme la feuille FFT : un trait par joueur, les branches réunissent les deux joueurs d'un match */
.ab-w { overflow-x: auto; padding: 4px 0 10px; }
.ab-h, .ab { display: grid; grid-template-columns: repeat(var(--c), minmax(150px, 1fr)); min-width: calc(var(--c) * 150px); }
.ab-h span { font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-text-mut); padding: 0 6px 6px; }
.ab { grid-template-rows: repeat(var(--l), 48px); }
.ab-s { position: relative; display: block; min-width: 0; background: none; border: 0; padding: 0; margin: 0; font: inherit; font-weight: 400; text-transform: none; letter-spacing: normal; box-shadow: none; border-radius: 0; color: var(--ui-text); text-align: left; min-height: 0; }
.ab-s::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid color-mix(in srgb, var(--ui-text) 55%, transparent); }
.ab-s.ab-up::after { content: ''; position: absolute; right: 0; top: 50%; height: 100%; border-right: 1.5px solid color-mix(in srgb, var(--ui-text) 55%, transparent); }
.ab-n { position: absolute; left: 6px; right: 10px; bottom: 50%; padding-bottom: 3px; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13.5px; }
.ab-n .nm { overflow: hidden; text-overflow: ellipsis; }
.ab-i { position: absolute; left: 6px; right: 10px; top: 50%; padding-top: 3px; font-size: 11.5px; color: var(--ui-text-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-cl { margin-left: auto; font-size: 11px; color: var(--ui-text-mut); flex: none; }
.ab-ts { flex: none; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--ui-accent-text, #E0284A); color: var(--ui-accent-text, #E0284A); font-size: 10px; font-weight: 800; line-height: 1; }
.ab-s.w .nm { font-weight: 800; }
.ab-s.l .nm { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }
.ab-s.q .nm { font-style: italic; color: var(--ui-text-mut); }
.ab-s.att .ab-i { color: #C77D0A; font-weight: 700; }
.ab-s.ct .ab-i { color: var(--ui-accent-text, #E0284A); font-weight: 700; }
.ab-s.ab-x { visibility: hidden; }
.ab-s.ab-fin .nm { font-weight: 800; color: var(--ui-accent-text, #E0284A); }
button.ab-s { cursor: pointer; }
button.ab-s:hover::before, button.ab-s:focus-visible::before { border-top-color: var(--ui-accent-text, #E0284A); border-top-width: 2.5px; }
/* poules et programme */
.in-poules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.in-poule { padding: 12px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); display: grid; gap: 8px; align-content: start; }
.in-poule h3 { margin: 0; }
.in-pt { width: 100%; border-collapse: collapse; font-size: 13px; }
.in-pt th { text-align: left; font-size: 11px; color: var(--ui-text-mut); font-weight: 700; padding: 2px 4px; }
.in-pt td { padding: 4px; border-top: 1px solid var(--ui-border); }
.in-pt tr.qual td { font-weight: 800; }
.in-pt tr.qual td:first-child { color: var(--ui-accent-text, #E0284A); }
.in-pm { display: grid; gap: 4px; }
.in-pm button, .in-pg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; width: 100%; text-align: left; border: 1px solid var(--ui-border); border-radius: 8px; background: var(--ui-surface); color: var(--ui-text); font: inherit; font-size: 13px; padding: 6px 8px; cursor: pointer; }
.in-pm button small, .in-pg small { color: var(--ui-text-mut); font-size: 11.5px; }
.in-pm button.att { border-color: #E3A33A; } .in-pm button.ct { border-color: var(--ui-accent-text, #E0284A); } .in-pm button.ok span { font-weight: 700; }
.in-pg { margin-top: 4px; } .in-pg b { min-width: 46px; }
.in-jour { margin: 14px 0 4px; font-size: 14px; text-transform: capitalize; }
.in-al { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 2px solid #E3A33A; background: color-mix(in srgb, #E3A33A 12%, transparent); margin-bottom: 8px; }
.in-al p { margin: 0; font-size: 13px; }
/* tableaux successifs : une carte par tableau, ses sections les unes sous les autres */
.in-sec + .in-sec { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--ui-border); }
.in-sec > h4 { margin: 0 0 8px; font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-accent-text); }
.in-m .ts { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: var(--ui-accent, #E0284A); color: #fff; margin-left: 6px; }
.in-m .j.q span:first-child { font-style: italic; color: var(--ui-text-mut); }
.in-st { display: grid; gap: 8px; }
.in-st .in-strow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; padding: 8px 10px; border-radius: var(--ui-r-sm); background: var(--ui-surface-2); }
.in-st .in-strow b { flex: 1 1 140px; }
.in-st .in-strow label { flex: 0 1 150px; }
.in-p .cl { width: 88px; }
/* composition à la main : une ligne par place du tableau */
.cp-g { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.cp-sec { display: grid; gap: 2px; align-content: start; }
.cp-sec h4 { margin: 0 0 4px; font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-accent-text); }
.cp-l { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.cp-l.bas { border-bottom: 1px dashed var(--ui-border); padding-bottom: 6px; margin-bottom: 4px; }
.cp-n { width: 26px; flex: none; text-align: right; font-size: 12px; color: var(--ui-text-mut); font-variant-numeric: tabular-nums; }
.cp-l select { flex: 1 1 auto; min-width: 0; padding: 6px 8px; }
.cp-v { flex: 1; }
.cp-ts { display: flex; flex-direction: row; align-items: center; gap: 4px; font-size: 11px; color: var(--ui-text-mut); flex: none; }
.cp-ts input { width: 52px; padding: 5px 6px; }
.cp-e { font-size: 11px; color: var(--ui-text-mut); width: 52px; flex: none; }
.cp-dims label { flex: 0 1 180px; }
main#app { min-width: 0; }
.in-fmt { font-size: 13px; color: var(--ui-text-mut); }
</style>
</head>
<body class="editor-page" data-page="encours">
<!-- même coque que l'éditeur des tournois : section « En cours », menu du tournoi à gauche (barre du bas sur téléphone) -->
<header class="appbar" id="appbar">
  <button class="ab-btn ab-menu" data-drawer-open aria-label="Ouvrir le menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"/></svg></button>
  <div class="ab-title"><a class="ab-logo" href="/dashboard" aria-label="Tableau de bord"><img class="lg-n" src="/img/ja-ram-rouge-blanc.png" alt="/RAM JA"><img class="lg-j" src="/img/ja-ram-rouge-noir.png" alt="/RAM JA"></a><b id="abTitle">Tournoi interne</b><small id="abSub"></small></div>
</header>
<div class="shell">
<aside class="side">
  <div class="side-t"><span class="side-ey">Tournoi en cours</span><b id="sName">Tournoi interne</b><small id="sSub"></small><span class="side-st" id="sState"></span></div>
  <nav id="nav">
    <button data-tab="tournoi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 21h8M9 17h6"/></svg><i>01</i><span class="lg">Tournoi</span><span class="sh">Tournoi</span></button>
    <button data-tab="participants"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6.2 4.4 1.8 5 4.8"/></svg><i>02</i><span class="lg">Participants</span><span class="sh">Joueurs</span></button>
    <button data-tab="tirage"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="9" height="13"/><rect x="12" y="4" width="9" height="13"/><path d="M16.5 8.5v4M14.5 10.5h4"/></svg><i>03</i><span class="lg">Tirage et composition</span><span class="sh">Tirage</span></button>
    <button data-tab="tableaux"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h5v6H3zM3 14h5v6H3zM8 7h3v10H8M11 12h3M14 9h7v6h-7z"/></svg><i>04</i><span class="lg">Tableaux et résultats</span><span class="sh">Tableaux</span></button>
    <button data-tab="programme"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M12 13v3l2 1.5"/></svg><i>05</i><span class="lg">Programmation</span><span class="sh">Planning</span></button>
  </nav>

<main id="app">
  <header class="top"><div class="top-t"><span class="tag" id="hTag">Tournoi interne</span><h1 id="hName">Chargement…</h1><div id="hSub" class="muted"></div></div><div class="top-actions" id="hAct"></div></header>
  <section id="tab-tournoi" class="tab"></section>
  <section id="tab-participants" class="tab"></section>

  <section id="tab-tableaux" class="tab"></section>

</main>
</div>
<script>
(function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const tid = location.pathname.split('/')[2], base = '/api/t/' + tid;
  let S = null, membres = [], club = true, ouvert = null, espace = null;
  /* liste déroulante des participants : adhérents du club (reliés à leur fiche), puis joueurs de la base /RAM JA */
  (window.RamSuggQ = window.RamSuggQ || []).push({
    match: el => el.hasAttribute('data-in-joueur'),
    filtre: false,
    source: async t => {
      const f = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(), pris = new Set(((S && S.int && S.int.players) || []).flatMap(p => p.ks || []));
      const l = membres.filter(m => !pris.has(m.k) && (!t || f(m.n).includes(f(t)))).map(m => ({ id: 'k:' + m.k, v: m.n, l: 'Adhérent · ' + [m.compte ? 'Compte /RAM' : 'Fiche sans compte', m.niv, m.lic ? 'lic. ' + m.lic : ''].filter(Boolean).join(' · '), d: { k: m.k }, pp: 1, ph: m.ph, ml: m.ml }));
      if (t.length >= 2) {
        const d = await fetch('/api/players?q=' + encodeURIComponent(t)).then(r => r.json()).catch(() => ({}));
        (d.players || []).filter(p => p.source !== 'club' && !(p.membres || []).some(x => x.c === espace)).forEach(p => l.push({ id: 'p:' + p.id, v: [p.first, p.last].filter(Boolean).join(' '), l: ['Joueur /RAM JA', p.club, p.rank, p.licence ? 'lic. ' + p.licence : ''].filter(Boolean).join(' · '), d: { p }, pp: 1, ph: p.photo, ml: p.mail }));
      }
      return l;
    }
  });
  /* la personne choisie dans la liste ; sinon le nom tapé, s'il ne désigne qu'un adhérent */
  const quiEst = inp => {
    if (!inp) return { n: '', k: null };
    const n = inp.value.trim(), it = inp._sugg;
    if (it && it.v === n) return { n, k: it.d && it.d.k ? it.d.k : null };
    const l = membres.filter(m => m.n.toLowerCase() === n.toLowerCase());
    if (l.length > 1) return { n, doublon: true };
    return { n, k: l[0] ? l[0].k : null };
  };
  document.head.appendChild(Object.assign(document.createElement('script'), { src: '/js/rail.js', defer: true }));
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
  async function send(type, payload) {
    const r = await fetch(base + '/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, payload: payload || {} }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { toast(d.error || 'Action refusée'); return false; }
    return true;
  }
  const I = () => S.int, nom = id => Int.nomDe(I(), id) || '…';
  const dateFr = d => (d ? d.split('-').reverse().join('/') : '');

  const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}</option>`;
  /* format de match (formats FFT 1 à 7 au tennis) et structure : tableau unique ou tableaux successifs par classement */
  function formatStructure() {
    const i = I(), tire = Int.tire(i), joue = Int.allMatches(i).some(m => m.w && !m.bye), tennis = i.sport === 'Tennis';
    const fmts = tennis ? Object.keys(Int.FORMATS).filter(f => i.simple || Int.FORMATS[f].pd) : [];
    const st = brouillon || i.struct || [], rep = Int.repartition(Object.assign({}, i, { struct: st }));
    const ech = cur => Int.ECHELONS.map(e => opt(e, e, cur)).join('');
    const formule = `<label>Formule<select id="in-mode" ${tire ? 'disabled' : ''}>${opt('tableaux', 'Tableaux à élimination directe', i.mode)}${opt('poules', 'Poules, puis tableau final', i.mode)}${opt('tmc', 'Tournoi multi-chances (TMC)', i.mode)}</select></label>`;
    const prog = `<h3 style="margin:14px 0 6px">Déroulement</h3>
      <label class="chk" style="display:flex;flex-direction:row;gap:10px;align-items:center"><input type="checkbox" id="in-prog" ${i.prog ? 'checked' : ''}>Matchs programmés par le juge-arbitre (jour, heure, terrain)</label>
      <p class="muted small">${i.prog ? 'Les joueurs sont prévenus de chaque programmation. Les limites de parties par jour, les repos et les horaires sont vérifiés (art. 13 et 14).' : 'Sinon, les joueurs organisent leurs matchs avant la date limite de chaque tour.'}</p>
      ${i.prog ? `<div class="in-row"><label>Terrains (séparés par des virgules)<input id="in-terr" value="${esc((i.terrains || []).join(', '))}" placeholder="Court 1, Court 2, Court 3"></label><label>Catégorie<select id="in-cat">${Object.keys(Int.CATEGORIES).map(k => opt(k, Int.CATEGORIES[k], i.categorie)).join('')}</select></label></div>` : ''}`;
    if (i.mode !== 'tableaux') {
      const c = i.pcfg || {}, rp = Int.repartitionPoules(i), n = Math.max(1, +c.n || 1);
      const corps = i.mode === 'tmc'
        ? `<p class="muted small">Tableau principal de 32 joueurs au plus ; les perdants de chaque tour sont reversés dans un tableau de classement. Chacun joue le même nombre de matchs et est classé de 1 à ${i.players.length || 'n'} (art. 51 bis). Pas de consolante.</p>`
        : `<div class="in-row"><label>Nombre de poules<input type="number" min="1" max="26" id="in-pn" value="${esc(c.n)}" ${tire ? 'disabled' : ''}></label><label>Qualifiés par poule<input type="number" min="1" max="3" id="in-pq" value="${esc(c.q)}" ${tire ? 'disabled' : ''}></label>
          <label>Joueurs en poules<select id="in-pmax" ${tire ? 'disabled' : ''}>${opt('', 'Tous', c.max || '')}${Int.ECHELONS.slice(0, -1).map(e => opt(e, 'Jusqu’à ' + e, c.max || '')).join('')}</select></label></div>
          <p class="muted small">${rp.poules.length} en poules (${Math.floor(rp.poules.length / n)} à ${Math.ceil(rp.poules.length / n)} par poule, 6 au plus), ${rp.direct.length} directement au tableau final. Une tête de série par poule ; le 2e d’une poule est placé dans l’autre moitié du tableau que le 1er.</p>`;
      return `<section class="card"><span class="eyebrow">Format et formule</span><h2>Comment se joue le tournoi</h2>
        <label>Format des matchs<select id="in-fmt" ${joue ? 'disabled' : ''}>${tennis ? fmts.map(f => opt(f, 'Format ' + f + ' : ' + Int.FORMATS[f].l, i.format)).join('') + opt(0, 'Score libre', i.format) : opt(0, 'Score libre (padel)', 0)}</select></label>
        ${formule}${corps}${prog}</section>`;
    }
    const npub = Int.publies(i), finTire = !!Int.final(i), figeSt = tire && (i.mode !== 'tableaux' || finTire);
    const lignes = st.map((x, k) => { const f = figeSt || k < npub; return `<div class="in-strow"><b>Tableau ${k + 1} · ${rep[k].length} joueur${rep[k].length > 1 ? 's' : ''}${k < npub ? ' · tiré' : tire ? ' · à tirer' : ''}</b>
        <label>Classement le plus haut<select data-st-max="${k}" ${f ? 'disabled' : ''}>${ech(x.max)}</select></label>
        <label>Qualifiés sortants<input type="number" min="1" max="16" data-st-q="${k}" value="${esc(x.q)}" ${f ? 'disabled' : ''}></label>
        ${f ? '' : `<button type="button" class="ib2" data-st-del="${k}">Retirer</button>`}</div>`; }).join('');
    return `<section class="card"><span class="eyebrow">Format et tableaux</span><h2>Comment se joue le tournoi</h2>

    const unTab = T => {
      const fige = Int.tabJoue(T), s = T.size / T.q, entreeNom = r => (r === 0 ? '1er tour' : (r + 1) + 'e tour');
      const lignes = j => Array.from({ length: s }, (_, k) => {
        const L = j * s + k, x = T.lines[L], p = Int.joueur(i, x);
        return `<div class="cp-l${L % 2 ? ' bas' : ''}"><span class="cp-n">${L + 1}</span>${fige ? `<span class="cp-v">${esc(x === 'BYE' ? 'Exempt' : Int.nomDe(i, x))}</span>` : `<select data-line="${L}" data-t="${esc(T.id)}" aria-label="Ligne ${L + 1}">${opts(T, x)}</select>`}
          ${p ? `<label class="cp-ts" title="Tête de série">TS<input type="number" min="0" max="64" data-ts="${esc(p.id)}" data-t="${esc(T.id)}" value="${(T.ts || {})[p.id] || ''}" ${fige ? 'disabled' : ''}></label><span class="cp-e">${entreeNom(Int.entree(T, L))}</span>` : ''}</div>`;
      }).join('');
      const corps = Array.from({ length: T.q }, (_, j) => `<div class="cp-sec">${T.q > 1 ? `<h4>Section ${j + 1} · qualifié ${j + 1}</h4>` : ''}${lignes(j)}</div>`).join('');
      const tailles = [2, 4, 8, 16, 32, 64, 128].filter(n => n * T.q >= T.lines.filter(x => x !== 'BYE').length || n === s);
      return `<section class="card"><span class="eyebrow">${esc(T.plage || (T.role === 'consol' ? 'Consolante' : T.role === 'class' ? 'Tableau de classement' : ''))}</span><h2>${esc(T.nom)}</h2>
        ${fige ? '<p class="muted small">Des résultats sont saisis : la composition de ce tableau est figée.</p>' : `<div class="in-row cp-dims"><label>Lignes par section<select data-dims-s="${esc(T.id)}">${tailles.map(n => `<option ${n === s ? 'selected' : ''}>${n}</option>`).join('')}</select></label>${T.role === 'inter' ? `<label>Sections (qualifiés)<input type="number" min="1" max="16" data-dims-q="${esc(T.id)}" value="${T.q}"></label>` : ''}<button type="button" class="btn ghost" data-dims="${esc(T.id)}">Appliquer</button></div>
        <p class="muted small">Choisissez pour chaque ligne un joueur, un exempt ou une place de qualifié : un joueur déjà placé échange sa place. Le tour d’entrée de chaque joueur s’affiche à droite.</p>`}
        <div class="cp-g">${corps}</div></section>`;
    };
    // tableaux publiés un par un : le prochain du découpage, ses joueurs et ses qualifiés entrants
    const suivant = () => {
      if (i.mode !== 'tableaux' || i.status === 'done') return '';
      const x = Int.prochain(i), der = Int.tabsOf(i).filter(t => t.role !== 'consol' && t.role !== 'class').slice(-1)[0];
      const retirer = der && !Int.tabJoue(der) && Int.publies(i) > 1 ? `<button class="btn ghost" id="in-tabundraw">Retirer le ${esc(der.nom.toLowerCase())}</button>` : '';
      if (!x) return retirer ? `<section class="card"><span class="eyebrow">Découpage</span><h2>Tous les tableaux sont tirés</h2><div class="in-row">${retirer}</div></section>` : '';
      return `<section class="card"><span class="eyebrow">Prochain tableau · non publié</span><h2>${esc(x.spec.nom)}${x.spec.plage ? ' · ' + esc(x.spec.plage) : ''}</h2>
        <p>${x.direct.length} joueur${x.direct.length > 1 ? 's' : ''} admis directement${x.qIn.length ? ' + ' + x.qIn.length + ' qualifié' + (x.qIn.length > 1 ? 's' : '') + ' du tableau précédent' : ''}${x.finalTab ? '' : ' · ' + x.spec.q + ' qualifié' + (x.spec.q > 1 ? 's' : '') + ' sortant' + (x.spec.q > 1 ? 's' : '') + ' (sections)'}.</p>
        ${x.direct.length ? `<p class="muted small">${x.direct.map(p => esc(p.n) + (p.cl ? ' (' + esc(p.cl) + ')' : '')).join(', ')}</p>` : ''}
        <div class="in-row"><button class="btn" data-tabdraw="auto">Tirer ce tableau</button><button class="btn ghost" data-tabdraw="vierge">Le composer à la main</button>${retirer}<button type="button" class="btn ghost" data-go="tournoi">Modifier le découpage</button></div>
        <p class="muted small">D’ici son tirage, vous pouvez inscrire des joueurs classés ${esc((Int.ajoutPossible(i).min) || '')} ou mieux et ajouter des tableaux au découpage (onglet Tournoi).</p></section>`;
    };
    const poulesC = () => !Int.poulesOf(i).length ? '' : `<section class="card"><span class="eyebrow">Poules</span><h2>Composition des poules</h2>
      <div class="in-poules">${Int.poulesOf(i).map(po => `<div class="in-poule"><h3>${esc(po.nom)} · ${po.joueurs.length}</h3>${po.joueurs.map(id => `<div class="in-p"><span class="n">${esc(nom(id))}${(Int.joueur(i, id) || {}).cl ? ' <span class="club">' + esc(Int.joueur(i, id).cl) + '</span>' : ''}</span><select data-pmove="${esc(id)}" aria-label="Changer de poule">${Int.poulesOf(i).map(x => `<option value="${x.k}" ${x.k === po.k ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>
      <p class="muted small">Un joueur déplacé dans une poule de 6 doit en échanger un autre : choisissez d’abord une poule qui a de la place.</p></section>`;
    return `<section class="card"><span class="eyebrow">Contrôles du règlement</span><h2>${ctl.length ? ctl.length + ' point' + (ctl.length > 1 ? 's' : '') + ' à vérifier' : 'Tableau conforme'}</h2>
        ${ctl.length ? `<div class="in-al">${ctl.map(c => `<p>${esc(c.txt)}</p>`).join('')}</div>` : '<p class="muted small">Chaque joueur est placé une fois ; têtes de série, exempts et qualifiés respectent les articles 45 à 49.</p>'}
        <div class="in-row">${joue ? '' : (partiel ? '' : '<button class="btn ghost" id="in-redraw">Refaire un tirage automatique</button><button class="btn ghost" id="in-revierge">Repartir d’un tableau vierge</button>') + '<button class="btn ghost" id="in-undraw">Annuler le tirage</button>'}</div></section>
      ${suivant()}${poulesC()}${Int.tabsOf(i).map(unTab).join('')}`;
  }
  function render() {
    if (!S || !S.int) return;
    document.title = S.tournament.name + ' — /RAM JA';
    const i = I(), fini = i.status === 'done', t = S.tournament;
    const sous = [i.sport, i.simple ? 'simple' : 'double', i.mode === 'poules' ? 'poules et tableau' : i.mode === 'tmc' ? 'TMC' : ''].filter(Boolean).join(' · ');
    const etat = fini ? 'Terminé' : Int.tire(i) ? 'En cours' : 'Inscriptions';
    [['#sName', t.name], ['#abTitle', t.name], ['#hName', t.name], ['#sSub', sous], ['#abSub', etat], ['#sState', etat], ['#hSub', Int.formatNom(i.format)], ['#hTag', 'Tournoi interne · ' + i.sport]].forEach(([s, v]) => { const el = $(s); if (el) el.textContent = v; });
    $('#hAct').innerHTML = fini ? '<button class="ghost" id="in-reopen">Rouvrir le tournoi</button>' : Int.tire(i) ? '<button class="ghost" id="in-close">Clôturer le tournoi</button>' : '';
    const pr = programme();
    const tabs = {
      tournoi: `<div class="grid g-2" style="align-items:start"><div class="grid">${formatStructure()}</div><div class="grid">${reglages()}<section class="card" data-adjoints></section></div></div>`,
      participants: participants(),
      tirage: tirage(),
      tableaux: `<div class="grid">${classement()}${tableau() || '<section class="card"><h2>Pas encore de tableau</h2><p class="muted">Les tableaux apparaissent après le tirage.</p><button type="button" class="btn" data-go="tirage">Aller au tirage</button></section>'}</div>`,
      programme: pr || `<section class="card"><span class="eyebrow">Programmation</span><h2>Matchs organisés par les joueurs</h2><p class="muted">Les joueurs organisent leurs matchs avant la date limite de chaque tour. Pour programmer chaque match (jour, heure, terrain), cochez « Matchs programmés » dans l’onglet Tournoi.</p><button type="button" class="btn ghost" data-go="tournoi">Ouvrir les réglages</button></section>`
    };
    Object.keys(tabs).forEach(k => { const el = $('#tab-' + k); if (el && el.dataset.h !== tabs[k]) { el.dataset.h = tabs[k]; el.innerHTML = tabs[k]; } });
    ouvrir(onglet || (Int.tire(i) ? 'tableaux' : 'participants'), true);
    bind();
  }
  /* onglets du menu du tournoi (gardés dans l'adresse : #tirage…) */
  let onglet = (location.hash || '').slice(1) || null;
  function ouvrir(t, sans) {
    if (!document.getElementById('tab-' + t)) t = 'tournoi';
    onglet = t;
    document.querySelectorAll('#nav button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    document.querySelectorAll('main .tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
    if (!sans) { history.replaceState(null, '', '#' + t); scrollTo(0, 0); }
  }
  document.querySelectorAll('#nav button[data-tab]').forEach(b => (b.onclick = () => ouvrir(b.dataset.tab)));
  function modal(m) {
    const d = document.createElement('div'), i = I(), pret = m.a && m.b && m.a !== 'BYE' && m.b !== 'BYE';
    d.className = 'in-modal';
    // programmation (jour, heure, terrain), aussi avant que les deux joueurs soient connus
    const prog = i.prog ? `<form id="in-pg" class="grid"><h3 style="margin:0">Programmation</h3><div class="in-row"><label>Jour<input type="date" name="d" value="${esc(m.d || '')}"></label><label>Heure<input type="time" name="h" min="07:00" value="${esc(m.h || '')}"></label>
      <label>Terrain<input name="c" list="in-terrains" value="${esc(m.c || '')}" maxlength="30"></label></div><datalist id="in-terrains">${(i.terrains || []).map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <div class="in-row"><button class="btn">Programmer</button>${m.d ? '<button type="button" class="btn ghost" id="in-unpg">Déprogrammer</button>' : ''}</div></form>` : '';
    d.innerHTML = `<div role="dialog" aria-label="Match"><h2 style="margin:0">${esc(m.a ? nom(m.a) : 'À venir')} contre ${esc(m.b ? nom(m.b) : 'à venir')}</h2><p class="muted small" style="margin:0">${esc(Int.nomTour(i, m))}</p>
      ${m.conteste ? `<p class="note">Contestation : ${esc(m.conteste)}</p>` : ''}${m.w && !m.conf ? `<p class="muted">Saisi par ${esc(nom(m.by))}, en attente de la confirmation de l’adversaire.</p>` : ''}
      ${prog}${pret ? '' : '<p class="muted small">Le résultat se saisit quand les deux joueurs sont connus.</p><div class="in-row"><button type="button" class="btn ghost" id="in-x">Fermer</button></div>'}
      <form id="in-res" class="grid" ${pret ? '' : 'hidden'}><fieldset style="border:0;padding:0;margin:0"><legend>Vainqueur</legend>
      <label class="chk"><input type="radio" name="w" value="${m.a}" ${m.w === m.a ? 'checked' : ''} required>${esc(nom(m.a))}</label>
      <label class="chk"><input type="radio" name="w" value="${m.b}" ${m.w === m.b ? 'checked' : ''}>${esc(nom(m.b))}</label></fieldset>
      <label>Score${Int.FORMATS[I().format] ? ` <span class="muted small">(${esc(Int.nomTour(I(), m))} · format ${I().format}, du côté du vainqueur)</span>` : ''}<input name="sc" value="${esc(m.sc || '')}" placeholder="${esc((Int.FORMATS[I().format] || {}).ex || '6-3 6-4')}" maxlength="60"></label>
      <label class="chk"><input type="checkbox" name="wo" ${m.wo ? 'checked' : ''}>Victoire par forfait</label>
      <div class="in-row"><button class="btn">Valider le résultat</button>${m.w ? '<button type="button" class="btn ghost" id="in-reset">Effacer</button>' : ''}${pret ? '<button type="button" class="btn ghost" id="in-x">Fermer</button>' : ''}</div></form></div>`;
    document.body.appendChild(d);
    const close = () => d.remove();
    d.addEventListener('click', e => { if (e.target === d) close(); });
    d.querySelector('#in-x').onclick = close;
    const pg = d.querySelector('#in-pg');
    if (pg) pg.onsubmit = async e => { e.preventDefault(); if (!pg.d.value) return toast('Choisis le jour du match'); if (await send('int/prog', { m: m.id, d: pg.d.value, h: pg.h.value, c: pg.c.value.trim() })) { close(); toast('Match programmé : les joueurs sont prévenus'); } };
    if (d.querySelector('#in-unpg')) d.querySelector('#in-unpg').onclick = async () => { if (await send('int/prog', { m: m.id, d: '' })) { close(); toast('Match déprogrammé'); } };
    if (d.querySelector('#in-reset')) d.querySelector('#in-reset').onclick = async () => { if (await send('int/reset', { m: m.id })) { close(); toast('Résultat effacé'); } };
    d.querySelector('#in-res').onsubmit = async e => {
      e.preventDefault();
      const f = e.target;
      if (await send('int/result', { m: m.id, w: f.w.value, sc: f.sc.value.trim(), wo: f.wo.checked })) { close(); toast('Résultat validé'); }
    };
  }
  function bind() {
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    const set = $('#in-set');
    if (set) set.onsubmit = async e => {
      e.preventDefault();
      const f = e.target, p = { name: f.name.value.trim(), club: f.club.value.trim(), dateStart: f.dateStart.value, dateEnd: f.dateEnd.value, regle: f.regle.value, regMode: f.pub.checked ? '' : 'none' };
      if (!f.sport.disabled) { p.sport = f.sport.value; p.simple = f.simple.value === '1'; }
      if (await send('int/setup', p)) toast('Réglages enregistrés');
    };
    const add = $('#in-add');
    if (add) add.onsubmit = async e => {
      e.preventDefault();
      const f = e.target, qui = [quiEst(f.a), f.b ? quiEst(f.b) : null].filter(x => x && x.n);
      if (qui.some(x => x.doublon)) return toast('Plusieurs adhérents portent ce nom : choisis la bonne personne dans la liste');
      const noms = qui.map(x => x.n), ks = qui.map(x => x.k).filter(Boolean);
      // simple : le classement de la fiche de l'adhérent ; double : le juge-arbitre le choisit
      const cl = (f.cl && f.cl.value) || (qui.length === 1 && qui[0].k ? ((membres.find(m => m.k === qui[0].k) || {}).cl || '') : '');
      if (await send('int/player/add', { n: noms.join(' / '), ks, cl })) { f.reset(); f.a.focus(); }
    };
    document.querySelectorAll('[data-cl]').forEach(s => (s.onchange = () => send('int/player/cl', { id: s.dataset.cl, cl: s.value })));
    const fmt = $('#in-fmt');
    if (fmt) fmt.onchange = async () => { if (await send('int/setup', { format: +fmt.value })) toast('Format enregistré'); };
    // structure : modifiée sur place, enregistrée d'un coup
    const st = () => (brouillon = brouillon || JSON.parse(JSON.stringify(I().struct || [])));
    on('#in-st-add', () => { const l = st(), der = l[l.length - 1], k = der ? Math.min(Int.ECHELONS.length - 2, Int.ECHELONS.indexOf(der.max) + 6) : 6; l.push({ max: Int.ECHELONS[k], q: 2 }); render(); });
    document.querySelectorAll('[data-st-max]').forEach(s => (s.onchange = () => { st()[+s.dataset.stMax].max = s.value; render(); }));
    document.querySelectorAll('[data-st-q]').forEach(s => (s.onchange = () => { st()[+s.dataset.stQ].q = +s.value; render(); }));
    document.querySelectorAll('[data-st-del]').forEach(b => (b.onclick = () => { st().splice(+b.dataset.stDel, 1); render(); }));
    on('#in-st-save', async () => { if (await send('int/setup', { struct: brouillon })) { brouillon = null; toast('Tableaux enregistrés'); } });
    document.querySelectorAll('[data-seed]').forEach(s => (s.onchange = () => send('int/player/seed', { id: s.dataset.seed, seed: +s.value })));
    document.querySelectorAll('[data-del]').forEach(b => (b.onclick = () => send('int/player/remove', { id: b.dataset.del })));
    document.querySelectorAll('[data-fin]').forEach(i => (i.onchange = () => send('int/tour', { t: i.dataset.t || '', r: +i.dataset.fin, fin: i.value })));
    document.querySelectorAll('[data-m]').forEach(b => (b.onclick = () => { const m = Int.findM(I(), b.dataset.m); if (!m) return; if (!(m.a && m.b) && !I().prog) return toast('Ce match attend encore ses joueurs.'); modal(m); }));
    document.querySelectorAll('[data-fin-poule]').forEach(x => (x.onchange = () => send('int/tour', { poule: +x.dataset.finPoule, fin: x.value })));
    document.querySelectorAll('[data-go]').forEach(b => (b.onclick = () => ouvrir(b.dataset.go)));
    // composition à la main
    document.querySelectorAll('[data-line]').forEach(s => (s.onchange = () => send('int/line', { t: s.dataset.t, L: +s.dataset.line, x: s.value })));
    document.querySelectorAll('[data-ts]').forEach(x => (x.onchange = () => send('int/ts', { t: x.dataset.t, id: x.dataset.ts, n: +x.value || 0 })));
    document.querySelectorAll('[data-dims]').forEach(b => (b.onclick = async () => {
      const t = b.dataset.dims, s = document.querySelector(`[data-dims-s="${t}"]`), q = document.querySelector(`[data-dims-q="${t}"]`);
      if (await send('int/dims', { t, s: +s.value, q: q ? +q.value : 1 })) toast('Dimension du tableau modifiée');
    }));
    document.querySelectorAll('[data-pmove]').forEach(s => (s.onchange = async () => {
      const k = +s.value, vers = Int.poulesOf(I()).find(po => po.k === k);
      let avec;
      if (vers && vers.joueurs.length >= 6) { avec = prompt('Cette poule est complète : nom exact du joueur à échanger', ''); const x = vers.joueurs.find(id => nom(id).toLowerCase() === String(avec || '').trim().toLowerCase()); if (!x) { render(); return toast('Échange annulé'); } avec = x; }
      if (!(await send('int/poule/move', { id: s.dataset.pmove, k, avec }))) render();
    }));
    document.querySelectorAll('[data-tabdraw]').forEach(b => (b.onclick = async () => { if (await send('int/tab/draw', { vierge: b.dataset.tabdraw === 'vierge' })) toast(b.dataset.tabdraw === 'vierge' ? 'Tableau publié, à composer' : 'Tableau tiré : les joueurs sont prévenus'); }));
    on('#in-tabundraw', async () => { if (confirm('Retirer le dernier tableau tiré ?') && await send('int/tab/undraw')) toast('Tableau retiré'); });
    on('#in-vierge', async () => { if (await send('int/draw', { vierge: true })) toast('Tableau vierge : placez chaque joueur'); });
    on('#in-revierge', async () => { if (confirm('Repartir d’un tableau vierge ? Tous les placements seront retirés.') && await send('int/draw', { vierge: true })) toast('Tableau vierge'); });
    // formule, poules, programmation : enregistrées aussitôt
    const val = id => ($(id) || {}).value;
    if ($('#in-mode')) $('#in-mode').onchange = () => send('int/setup', { mode: val('#in-mode') });
    ['#in-pn', '#in-pq', '#in-pmax'].forEach(id => { if ($(id)) $(id).onchange = () => send('int/setup', { pcfg: { n: +val('#in-pn'), q: +val('#in-pq'), max: val('#in-pmax') } }); });
    if ($('#in-prog')) $('#in-prog').onchange = () => send('int/setup', { prog: $('#in-prog').checked });
    if ($('#in-terr')) $('#in-terr').onchange = () => send('int/setup', { terrains: val('#in-terr').split(',') });
    if ($('#in-cat')) $('#in-cat').onchange = () => send('int/setup', { categorie: val('#in-cat') });
    on('#in-consol', () => {
      const i = I(), C = Int.consolante(i), dans = new Set(C ? C.lines.filter(x => Int.joueur(i, x)) : Int.consolables(i).map(p => p.id));
      const d = document.createElement('div'); d.className = 'in-modal';
      d.innerHTML = `<div role="dialog" aria-label="Consolante"><h2 style="margin:0">Consolante</h2><p class="muted small">Cochez les joueurs battus qui ont accepté de jouer la consolante.</p>
        <form id="in-cf" class="grid">${Int.consolables(i).map(p => `<label class="chk"><input type="checkbox" name="c" value="${p.id}" ${dans.has(p.id) ? 'checked' : ''}>${esc(p.n)}${p.cl ? ' · ' + esc(p.cl) : ''}</label>`).join('')}
        <div class="in-row"><button class="btn">Tirer la consolante</button>${C ? '<button type="button" class="btn ghost" id="in-cdel">Supprimer la consolante</button>' : ''}<button type="button" class="btn ghost" id="in-cx">Fermer</button></div></form></div>`;
      document.body.appendChild(d);
      const close = () => d.remove();
      d.querySelector('#in-cx').onclick = close;
      d.addEventListener('click', e => { if (e.target === d) close(); });
      if (d.querySelector('#in-cdel')) d.querySelector('#in-cdel').onclick = async () => { if (await send('int/consol', { ids: [] })) { close(); toast('Consolante supprimée'); } };
      d.querySelector('#in-cf').onsubmit = async e => { e.preventDefault(); const ids = [...d.querySelectorAll('input[name=c]:checked')].map(x => x.value); if (await send('int/consol', { ids })) { close(); toast('Consolante tirée'); } };
    });
    on('#in-draw', async () => { if (await send('int/draw')) toast('Tableau tiré : chaque joueur est prévenu de son adversaire'); });
    on('#in-redraw', async () => { if (confirm('Refaire le tirage ? Les joueurs seront prévenus de leur nouvel adversaire.') && await send('int/draw', { reseed: true })) toast('Nouveau tirage'); });
    on('#in-undraw', async () => { if (confirm('Annuler le tirage ?')) await send('int/undraw'); });
    on('#in-close', async () => { if (!confirm('Clôturer le tournoi ? Plus aucun résultat ne pourra être saisi.')) return; const r = await fetch('/api/tournaments/' + tid + '/close', { method: 'POST' }); if (r.ok) toast('Tournoi clôturé'); });
    on('#in-reopen', async () => { const r = await fetch('/api/tournaments/' + tid + '/reopen', { method: 'POST' }); if (r.ok) toast('Tournoi rouvert'); });
  }
  const es = new EventSource(base + '/events');
  es.onmessage = ev => { const d = JSON.parse(ev.data); if (d.state) { S = d.state; render(); } };
  fetch(base + '/membres').then(r => r.json()).then(d => { membres = d.membres || []; espace = d.espace || null; club = d.club !== false; render(); }).catch(() => {});
})();
</script>
</body>
</html>
