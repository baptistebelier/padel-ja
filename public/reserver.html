<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Réserver un cours — /Dojo</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<script>
/* Les feuilles et scripts communs des trois applis vivent dans le dossier du Club : /club/… sur le domaine principal, à la racine sur coach. et club. */
(function () {
  var B = /^(coach|club)\./.test(location.hostname) ? '' : '/club', s = document.documentElement.style;
  s.setProperty('--mk', 'url(' + B + '/motifs/w30/padel-base.png)');
  s.setProperty('--ma', 'url(' + B + '/motifs/w30/padel-accent.png)');
  document.write('<link rel="stylesheet" href="' + B + '/ds.css"><script src="' + B + '/liste.js"><\/script>');
})();
</script>
<style>
  /* /Dojo · réservation en ligne : mêmes jetons que /Buvette, /Dojo et /Pista (club/ds.css) ; teintes par défaut du Dojo (app/2-couleurs.js, base teintée par #74102A) */
  :root{--bg:#F1EDEE;--card:#FDFBFC;--card2:#EAE5E6;--field:#EAE5E6;--ink:#16191E;--fg:#16191E;--muted:#595D66;--off:#D9D1D3;--kick:#B0123F;--hero:#74102A;--accent-bg:#E0F50A;--on-accent-bg:#0B0B0B;--accent:#E0F50A;--accent2:#FF3D6B;--gut:16px}
  @media (prefers-color-scheme:dark){:root{--bg:#1A181A;--card:#252326;--card2:#2E2B30;--field:#201E20;--ink:#000;--fg:#F4F4F5;--muted:#C8C8CE;--off:#3C393E;--kick:#FF6B8E}}
  @media (max-width:700px){:root{--gut:10px}}
  *,*::before,*::after{box-sizing:border-box;border-radius:0}
  html{-webkit-text-size-adjust:100%;background:var(--c-bg)}
  body{margin:0;background:var(--c-bg);color:var(--c-text);font:15px/1.45 var(--f-body);position:relative;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
  button:disabled{cursor:default}
  p{margin:0}
  svg{display:block}
  /* fond à motifs teinté du Dojo (padel) */
  .motif{position:fixed;inset:0;z-index:0;pointer-events:none}
  .motif::before,.motif::after{content:'';position:absolute;inset:0;-webkit-mask:var(--mk) 0 0/800px 800px repeat;mask:var(--mk) 0 0/800px 800px repeat;background:color-mix(in srgb,var(--c-text) 9%,transparent)}
  .motif::after{-webkit-mask-image:var(--ma);mask-image:var(--ma);background:color-mix(in srgb,var(--c-accent) 14%,transparent)}
  #m{position:relative;z-index:1}
  .ic{flex:none;fill:none;stroke:currentColor}
  :focus-visible{outline:3px solid var(--c-pink);outline-offset:2px}

  /* en-tête : écusson (photo ou initiales), nom, club */
  /* en-tête bord à bord, fond uni opaque (celui de l'en-tête des applis : --c-bg), fixe en haut, zone sûre de l'iPhone respectée ; son contenu suit la colonne de la page */
  .top{position:sticky;top:0;z-index:5;background:var(--c-bg);padding-top:env(safe-area-inset-top,0px)}
  .top-in{display:flex;align-items:center;gap:12px;min-height:64px;max-width:1320px;margin:0 auto;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) 10px max(var(--gut),env(safe-area-inset-left,0px))}
  .crest{display:grid;place-items:center;flex:none;width:44px;height:44px;background:var(--c-lime);color:var(--c-dark);border:var(--bw) solid var(--c-ink);font:400 17px/1 var(--f-display);text-transform:uppercase;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--accent2);overflow:hidden}
  .crest img{width:100%;height:100%;object-fit:cover}
  .top h1{margin:0;font:400 24px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
  .top .sub{margin-top:2px;color:var(--c-muted);font-size:13px}
  .top .r-tag{display:none;margin-left:auto}
  .ti{padding:8px var(--gut) 0}
  .ti h2{margin:4px 0 0;font:400 26px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
  .pad{display:flex;flex-direction:column;gap:18px;max-width:1320px;margin:0 auto;padding:16px var(--gut) 40px}
  .pad.bas-p{padding-bottom:110px}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}

  /* parcours (ordinateur) : pastilles de progression, pas des onglets */
  .steps{display:none;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
  .steps li{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:var(--bw) solid var(--c-ink);background:var(--c-surface);box-shadow:var(--sh-sm);font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
  .steps .ok{background:var(--c-lime);color:var(--c-dark)}
  .steps .on{background:var(--c-ink);color:var(--c-surface)}

  /* cartes : le .r-card de ds.css, avec son titre intégré */
  .r-card__head{flex-wrap:wrap}
  .r-card__head .gr{flex:1;min-width:0}
  .r-card__head .acts{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1 0 100%}
  @media (min-width:700px){.r-card__head .acts{flex:0 0 auto;margin-left:auto}}
  .cmpt{color:var(--c-muted);font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}

  /* intercalaires : même dessin que les bandes d'onglets des trois applis (ds.css), collés à la carte du dessous, écart 0 */
  .seg{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:flex-end;gap:6px;margin:0 0 -2px;padding:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:2}
  .seg::-webkit-scrollbar{display:none}
  .seg>button{flex:none;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c-bg);color:var(--c-text);border:var(--bw) solid var(--c-ink);border-bottom:0;font:700 16px/1.1 var(--f-label);letter-spacing:.02em;white-space:nowrap}
  .seg>button[aria-selected=true]{background:var(--c-surface);box-shadow:inset 0 4px 0 var(--c-lime);padding-bottom:2px}
  .seg>button:disabled{opacity:.5}
  .seg .cnt{padding:1px 6px;border:var(--bw) solid var(--c-ink);background:var(--c-pink);color:var(--c-dark);font:700 13px/1.2 var(--f-label)}
  .seg+.r-card{margin-top:0}

  /* filtres de formules : listes déroulantes maison (liste.js), largeur et style de la boîte */
  .flt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 14px}
  .flt .r-field{min-width:0}
  .info{margin:0 0 12px;padding:8px 12px;border:var(--bw) solid var(--c-ink);background:var(--c-surface-2);font-size:13px}
  .vide{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:var(--bw) dashed var(--c-ink);background:var(--c-surface-2)}
  .vide b{font:700 19px/1.15 var(--f-label)}

  /* cartes de formule : à comparer d'un coup d'œil */
  .fos{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .fo{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px;background:var(--c-surface-2);border:var(--bw) solid var(--c-ink);color:var(--c-text)}
  .fo[aria-pressed=true]{background:var(--c-lime);color:var(--c-dark);box-shadow:var(--sh-sm)}
  .fo .fh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .fo .nm{font:700 19px/1.15 var(--f-label);overflow-wrap:anywhere}
  .fo .r-tag{flex:none;background:var(--c-bg);color:var(--c-text);box-shadow:none}
  .fo[aria-pressed=true] .r-tag{background:var(--c-dark);color:var(--c-lime);border-color:var(--c-dark)}
  .fo .mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;padding:0}
  .fo .mt div{min-width:0}
  .fo dt{margin:0;color:var(--c-muted);font:700 12px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
  .fo dd{margin:0;font:700 16px/1.25 var(--f-label)}
  .fo[aria-pressed=true] dt{color:var(--c-dark);opacity:.7}
  .fo .pp{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;padding-top:10px;border-top:var(--bw) solid color-mix(in srgb,var(--c-ink) 18%,transparent)}
  .fo .pr{font:400 28px/1 var(--f-display)}
  .fo .pr small{font:700 14px/1 var(--f-label);letter-spacing:.02em}
  .fo .ps{color:var(--c-muted);font-size:13px}
  .fo[aria-pressed=true] .ps{color:var(--c-dark)}

  /* jours : calendrier du mois (ordinateur), bande de jours (téléphone) */
  .nav{display:flex;gap:8px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .dow{text-align:center;color:var(--c-muted);font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase;padding-bottom:2px}
  .dj{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;padding:0;background:var(--c-surface);border:var(--bw) solid var(--c-ink);color:var(--c-text)}
  .dj .nb{font:400 20px/1.2 var(--f-display)}
  .dj .pt{width:8px;height:8px;background:var(--c-kick)}
  .dj small{font-size:12px;color:var(--c-muted)}
  .dj.off{background:var(--c-off);color:var(--c-muted)}
  .dj.vide0{visibility:hidden;border:0}
  .dj[aria-pressed=true]{background:var(--c-lime);color:var(--c-dark);box-shadow:var(--sh-sm)}
  .dj[aria-pressed=true] .pt{background:var(--c-dark)}
  .dj[aria-pressed=true] small,.dj[aria-pressed=true] .dw{color:var(--c-dark)}
  .leg{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;color:var(--c-muted);font-size:13px}
  .leg span{display:flex;align-items:center;gap:8px}
  .leg i{display:block;width:8px;height:8px;background:var(--c-kick)}
  .leg i.p{width:16px;height:16px;background:var(--c-off);border:var(--bw) solid var(--c-ink)}
  .bande{display:flex;gap:8px;margin:0 calc(-1*var(--s5));padding:2px var(--s5) 8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .bande .dj{flex:none;width:64px;min-height:80px;gap:2px;scroll-snap-align:start}
  .bande .dj .dw{color:var(--c-muted);font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
  .bande .dj .nb{font-size:24px}
  .lien{background:none;border:0;padding:6px 0;min-height:32px;color:var(--c-kick);font:700 14px/1.2 var(--f-label);text-decoration:underline}

  /* horaires */
  .gl{display:flex;align-items:center;gap:8px;margin:16px 0 10px;color:var(--c-muted)}
  .gl:first-of-type{margin-top:0}
  .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .slot{height:48px;padding:0;text-align:center;background:var(--c-surface-2);border:var(--bw) solid var(--c-ink);font:700 18px/1 var(--f-label);color:var(--c-text)}
  .slot[aria-pressed=true]{background:var(--c-lime);color:var(--c-dark);box-shadow:var(--sh-sm)}
  .vide-m{color:var(--c-muted)}

  /* récapitulatif */
  .rc1{font:700 20px/1.2 var(--f-label)}
  .rc2{margin-top:4px;font-size:15px}
  .rc3{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--c-muted);font-size:13px}
  .hr{height:2px;margin:14px 0;background:var(--c-ink);border:0}
  .tot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
  .tot b:first-child{font:700 18px/1.2 var(--f-label)}
  .tot b:last-child{font:400 30px/1.2 var(--f-display)}
  .note{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--c-muted);font-size:13px}
  .dg{margin-top:6px;color:var(--c-muted);font-size:13px}
  .rcm{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}
  .rcm b{display:block;font:700 18px/1.2 var(--f-label)}
  .rcm small{display:block;margin-top:2px;color:var(--c-muted);font-size:13px}

  /* formulaire */
  .fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .fm .w{grid-column:1/-1}
  .r-field>label small,.r-field>.lbl small{margin-left:6px;font:400 12px var(--f-body);letter-spacing:0;text-transform:none;color:var(--c-muted)}
  .r-field>.lbl{font:700 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
  .chk{display:flex;align-items:flex-start;gap:12px;font-size:13px;cursor:pointer}
  .chk .r-check{margin-top:0}
  .pot{position:absolute;left:-9999px}
  .err{color:var(--c-pink);font-weight:600}
  .err:empty{display:none}

  /* confirmation */
  .fin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
  .fin .ok{display:grid;place-items:center;width:72px;height:72px;background:var(--c-lime);border:var(--bw) solid var(--c-ink);box-shadow:var(--sh);color:var(--c-dark)}
  .fin .tx{margin-top:6px;font-size:14px}
  .cc{display:flex;flex-direction:column;gap:10px}
  .cc .jr{font:400 24px/1.2 var(--f-display);text-transform:uppercase}
  .cc .li{display:flex;align-items:center;gap:8px}
  .cc .tot{margin:0}
  .cc .tot span{color:var(--c-muted);font-size:13px}
  .cc .tot b:last-child{font-size:28px}
  .ann{text-align:center;margin-top:6px;color:var(--c-muted);font-size:13px}
  .btn-b{display:flex;flex-direction:column;gap:12px}

  /* barre du bas (téléphone) */
  .bas{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));background:var(--c-surface);border-top:var(--bw) solid var(--c-ink)}
  .bas b{display:block;font:700 17px/1.2 var(--f-label)}
  .bas small{display:block;color:var(--c-muted);font-size:13px}
  .bas .r-btn{flex:none}

  .dk{display:none!important}
  @media (min-width:700px){.fos{grid-template-columns:repeat(2,minmax(0,1fr))}.flt{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (min-width:900px){
    .mb{display:none!important}
    .dk{display:block!important}
    .r-card__head.dk,.col.dk{display:flex!important}
    .top-in{min-height:76px;padding-top:14px;padding-bottom:14px}
    .crest{width:52px;height:52px;font-size:20px}
    .top h1{font-size:30px}
    .top .r-tag{display:inline-flex}
    .ti h2{font-size:34px}
    .steps{display:flex}
    .pad{padding-bottom:60px}
    .grille.tabs-on>.col+.col{padding-top:42px}
    .grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:20px;align-items:start}
    .fm{gap:14px 16px}
    .dj{min-height:62px}
    .cal{gap:8px}
  }
  @media (min-width:1200px){.fos{grid-template-columns:repeat(3,minmax(0,1fr))}.grille{grid-template-columns:minmax(0,1fr) 440px}}
  @media (max-width:899px){.grille{display:flex;flex-direction:column;gap:18px}}
</style>
</head>

  <symbol id="i-plus" viewBox="0 0 18 18"><path d="M9 3.75V9M9 9V14.25M9 9H3.75M9 9H14.25" stroke-width="1.5" stroke-linecap="square"/></symbol>
  <symbol id="i-x" viewBox="0 0 18 18"><path d="M4.5 4.5L9 9M9 9L13.5 13.5M9 9L13.5 4.5M9 9L4.5 13.5" stroke-width="1.5" stroke-linecap="square"/></symbol>
  <symbol id="i-ball" viewBox="0 0 18 18"><path d="M9 2.25A6.75 6.75 0 1 0 9 15.75A6.75 6.75 0 1 0 9 2.25ZM3.2 6C6 6.2 7.2 8 7.2 9S6 11.8 3.2 12M14.8 6C12 6.2 10.8 8 10.8 9S12 11.8 14.8 12" stroke-width="1.5" stroke-linecap="square"/></symbol>
  <symbol id="i-user" viewBox="0 0 18 18"><path d="M9 8.25A2.75 2.75 0 1 0 9 2.75A2.75 2.75 0 1 0 9 8.25ZM3.5 15.5C3.5 12.5 6 10.75 9 10.75S14.5 12.5 14.5 15.5" stroke-width="1.5" stroke-linecap="square"/></symbol>
</svg>
<div class="motif" aria-hidden="true"></div>
<div id="m"><main class="pad"><p>Chargement…</p></main></div>
<script>
/* /Dojo · réservation en ligne : la page publique, sans compte. Tout ce qui vient du serveur passe par e() avant d'être affiché. */
(function () {
  var root = document.getElementById('m'), parts = location.pathname.split('/').filter(Boolean), q = new URLSearchParams(location.search);
  var e = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var post = function (url, b) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Action impossible'); return d; }); }); };
  var H = function (n) { return Math.floor(n / 60) + ' h' + (n % 60 ? ' ' + String(n % 60).padStart(2, '0') : ''); };
  var DUR = function (n) { return n < 60 ? n + ' min' : H(n); };
  var iso = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var at = function (s) { return new Date(s + 'T12:00:00'); };
  var jour = function (s, o) { return at(s).toLocaleDateString('fr-FR', o || { weekday: 'long', day: 'numeric', month: 'long' }); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var court = function (s) { return cap(jour(s, { weekday: 'short', day: 'numeric', month: 'short' })); };
  var ic = function (n, s, c) { return '<svg class="ic ' + (c || '') + '" width="' + s + '" height="' + s + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; };
  var initiales = function (n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('') || '·'; };
  var c = parts[1], k = parts[2];
  var S = { w: 0, data: null, f: null, pick: null, jour: null, etape: 'choisir', mois: false, conf: null, fl: { t: '', j: '', d: '', s: '', sp: '' }, v: { p: '', n: '', t: '', em: '', o: '', niv: '', cv: '', pa: '' } };
  var top = function (nom, sous) {
    var ph = S.data && S.data.photo && nom === S.data.coach ? '/api/public/resa/photo?c=' + encodeURIComponent(c) + '&k=' + encodeURIComponent(k) : '';
    return '<header class="top"><div class="top-in"><span class="crest">' + (ph ? '<img src="' + e(ph) + '" alt="" data-i="' + e(initiales(nom)) + '">' : e(initiales(nom))) + '</span><div><h1>' + e(nom) + '</h1><p class="sub">' + e(sous) + '</p></div><span class="r-tag r-tag--flat">Réservation en ligne</span></div></header>';
  };
  /* photo introuvable ou illisible : retour aux initiales */
  root.addEventListener('error', function (ev) {
    var i = ev.target;
    if (i && i.tagName === 'IMG' && i.closest('.crest')) i.replaceWith(document.createTextNode(i.dataset.i || ''));
  }, true);
  var page = function (nom, sous, corps, bas) { root.innerHTML = top(nom, sous) + '<main class="pad' + (bas ? ' bas-p' : '') + '">' + corps + '</main>'; };
  var titre = function (kick, t) { return '<div class="ti" style="padding:0"><span class="r-surtitre">' + e(kick) + '</span><h2>' + e(t) + '</h2></div>'; };
  var head = function (i, t, acts, cl) { return '<div class="r-card__head ' + (cl || '') + '">' + (i ? ic(i, 20) : '') + '<b>' + e(t) + '</b>' + (acts ? '<span class="acts">' + acts + '</span>' : '') + '</div>'; };

  if (parts[1] === 'annuler') {
    page('Réservation', '/Dojo · réservation en ligne', '<div class="fin">' + titre('Annuler mon cours', 'Annuler ce cours') + '<div class="r-card"><p>Tu peux annuler jusqu’à 24 h avant le cours. L’enseignant est prévenu.</p><p style="margin-top:14px"><button class="r-btn r-btn--full" id="a" type="button">' + ic('x', 18) + 'Annuler ce cours</button></p><p class="err" id="er" role="alert"></p></div></div>');
    document.getElementById('a').onclick = function () {
      post('/api/public/resa/annuler', { c: q.get('c'), id: q.get('id'), t: q.get('t') })
        .then(function () { page('Réservation', '/Dojo · réservation en ligne', '<div class="fin">' + titre('Annuler mon cours', 'Cours annulé') + '<div class="r-card"><p>C’est fait : l’enseignant est prévenu.</p></div></div>'); })
        .catch(function (x) { document.getElementById('er').textContent = x.message; });
    };
    return;
  }
  var moisDe = function (w) { var d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth() + w, 1)); };
  var nb = function (de) { var p = de.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); };
  function charge() {
    fetch('/api/public/resa/creneaux?c=' + encodeURIComponent(c) + '&k=' + encodeURIComponent(k) + '&de=' + moisDe(S.w) + '&n=' + nb(moisDe(S.w)))
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function (d) { S.data = d; /* rien n'est présélectionné : ni formule, ni jour, ni horaire */ if (!offres().some(function (x) { return x.k === S.f; })) S.f = null; S.pick = null; S.jour = null; dessine(); })
      .catch(function (x) { page('Réserver un cours', '/Dojo · réservation en ligne', '<div class="r-card"><p>' + e(x.message || 'Page indisponible') + '</p></div>'); });
  }

  /* ---------- tout ce que l'enseignant propose, tel que l'API le renvoie : formules, packs, abonnements ---------- */
  var eur = function (n) { return (Math.round(n * 100) / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' €'; };
  var PER = { mois: 'par mois', trimestre: 'par trimestre', '6 mois': 'tous les 6 mois', an: 'par an' };
  var genre = function (n) { return n === 1 ? 'Individuel' : n === 2 ? 'Duo' : 'Collectif'; };
  var TYPES = { f: 'À la séance', p: 'Pack', a: 'Abonnement' };
  var engage = function (a) { var n = +a.engagement || 1, m = { mois: 1, trimestre: 3, '6 mois': 6 }[a.periode]; return n <= 1 ? '' : m ? 'Engagement ' + n * m + ' mois' : 'Engagement ' + n + ' ' + (a.periode === 'an' ? 'ans' : a.periode); };
  function offres() {
    var d = S.data, fo = d.formules || [], de = function (id) { return fo.filter(function (f) { return f.id === id; })[0] || null; };
    return fo.map(function (f) {
      var j = +f.joueurs, tot = f.par === 'personne' ? f.prix * j : f.prix;
      return { k: 'f:' + f.id, t: 'f', id: f.id, nom: f.nom, duree: f.duree, dOk: true, joueurs: j, sport: f.sport || '', n: 1, ns: '1 séance', prix: f.prix, pn: eur(f.prix), un: f.par === 'personne' && j > 1 ? '/ pers.' : '',
        ps: j === 1 ? 'la séance' : f.par === 'personne' ? 'soit ' + eur(tot) + ' la séance' : 'soit ' + eur(f.prix / j) + ' par personne' };
    }).concat((d.packs || []).map(function (p) {
      var f = de(p.formule) || {};
      return { k: 'p:' + p.id, t: 'p', id: p.id, nom: p.nom, duree: p.duree, dOk: true, joueurs: +f.joueurs || 1, sport: f.sport || '', n: p.seances, ns: p.seances + ' séances', prix: p.prix, pn: eur(p.prix), un: '', ps: 'soit ' + eur(p.prix / p.seances) + ' la séance' };
    })).concat((d.abos || []).map(function (a) {
      var f = de(a.formule), pm = +a.parMois > 0 ? +a.parMois : 0;
      return { k: 'a:' + a.id, t: 'a', id: a.id, nom: a.nom, duree: a.duree, dOk: !!f, joueurs: f ? +f.joueurs : null, sport: f ? f.sport || '' : '', n: null, ns: pm ? pm + ' par mois' : '', prix: a.prix, pn: eur(a.prix), un: PER[a.periode] || '',
        ps: [a.periode === 'mois' && pm ? 'soit ' + eur(a.prix / pm) + ' la séance' : '', engage(a)].filter(Boolean).join(' · ') };
    }));
  }
  var formule = function () { return offres().filter(function (x) { return x.k === S.f; })[0]; };
  var prixTxt = function (f) { return S.v.cv ? 'Inclus' : f.pn + (f.un ? ' ' + f.un : ''); };

  /* ---------- filtres : seulement ceux qui ont au moins deux valeurs réelles ; ils se combinent, chaque valeur annonce son nombre de résultats ---------- */
  var DIMS = [
    { k: 't', lab: 'Type', val: function (o) { return o.t; }, txt: function (v) { return TYPES[v]; } },
    { k: 'j', lab: 'Personnes', val: function (o) { return o.joueurs; }, txt: function (v) { return v === 1 ? '1 personne' : v + ' personnes'; } },
    { k: 'd', lab: 'Durée', val: function (o) { return o.dOk ? o.duree : null; }, txt: function (v) { return DUR(+v); } },
    { k: 's', lab: 'Séances', val: function (o) { return o.n; }, txt: function (v) { return v + ' séance' + (v > 1 ? 's' : ''); } },
    { k: 'sp', lab: 'Sport', val: function (o) { return o.sport || null; }, txt: function (v) { return v; } }
  ];
  var passe = function (o, sauf) { return DIMS.every(function (m) { return m.k === sauf || S.fl[m.k] === '' || String(m.val(o)) === S.fl[m.k]; }); };
  function filtres(all) {
    return DIMS.map(function (m) {
      var vals = [];
      all.forEach(function (o) { var v = m.val(o); if (v != null && vals.indexOf(v) < 0) vals.push(v); });
      vals.sort(function (a, b) { return typeof a === 'number' ? a - b : String(a).localeCompare(String(b)); });
      if (m.k === 't') vals.sort(function (a, b) { return 'fpa'.indexOf(a) - 'fpa'.indexOf(b); });
      return { m: m, vals: vals.map(function (v) { return { v: v, n: all.filter(function (o) { return passe(o, m.k) && String(m.val(o)) === String(v); }).length }; }), tot: all.filter(function (o) { return passe(o, m.k); }).length };
    }).filter(function (d) { return d.vals.length >= 2; });
  }
  var actifs = function () { return DIMS.filter(function (m) { return S.fl[m.k] !== ''; }).length; };

  var heures = function (j, f) { var l = []; j.libres.forEach(function (p) { for (var t = p.du; t + f.duree <= p.au; t += 30) l.push(t); }); return l; };
  function garde() { ['p', 'n', 't', 'em', 'o', 'pa'].forEach(function (i) { var x = document.getElementById(i); if (x) S.v[i] = x.value; }); }

  function entete(kick, t) {
    var l = ['Formule', 'Jour', 'Horaire', 'Vos infos'], cur = S.etape === 'infos' ? 3 : !S.f ? 0 : !S.jour ? 1 : 2;
    return titre(kick, t) + '<ol class="steps" aria-label="Étapes">' + l.map(function (x, i) {
      return '<li class="' + (i < cur ? 'ok' : i === cur ? 'on' : '') + '"' + (i === cur ? ' aria-current="step"' : '') + '>' + (i < cur ? ic('check', 14) : (i + 1) + ' ·') + ' ' + x + '</li>';
    }).join('') + '</ol>';
  }

  function recap(f, mode) {
    var p = S.pick, d = S.data;
    if (!f) return '<section class="r-card" aria-label="Votre cours">' + head('clock', 'Votre cours') + '<p class="rc2" style="color:var(--c-muted)">Choisissez d’abord une formule.</p><p class="rc3">' + ic('pin', 16) + '<span>' + e(d.club) + '</span></p><hr class="hr"><button type="button" class="r-btn r-btn--full" data-a="suite" disabled>' + ic('chev', 18) + 'Continuer</button><p class="note">' + ic('shield', 16) + '<span>Annulation gratuite jusqu’à 24 h avant.</span></p></section>';
    return '<section class="r-card" aria-label="Votre cours">' + head('clock', 'Votre cours') +
      '<p class="rc1">' + e(f.nom) + (f.dOk ? ' · ' + DUR(f.duree) : '') + '</p>' +
      (p ? '<p class="rc2">' + e(court(p.d)) + ' · ' + H(p.t) + ' – ' + H(p.t + f.duree) + '</p>' : '<p class="rc2" style="color:var(--c-muted)">' + (S.jour ? 'Choisissez un horaire.' : 'Choisissez un jour, puis un horaire.') + '</p>') +
      '<p class="rc3">' + ic('pin', 16) + '<span>' + e(d.club) + '</span></p><hr class="hr">' +
      '<p class="tot"><b>Total</b><b>' + e(prixTxt(f)) + '</b></p>' +
      (mode === 'continuer' ? '<button type="button" class="r-btn r-btn--full" data-a="suite"' + (p ? '' : ' disabled') + '>' + ic('chev', 18) + 'Continuer</button><p class="note">' + ic('shield', 16) + '<span>Annulation gratuite jusqu’à 24 h avant.</span></p>' :
        '<button type="button" class="r-btn r-btn--sec r-btn--full" data-a="change">' + ic('edit', 18) + 'Changer de créneau</button>') + '</section>';
  }

  /* le bloc des formules : intercalaires de type collés à la carte, filtres, compteur, cartes */
  function blocFormules() {
    var all = offres(), fl = filtres(all), res = all.filter(function (o) { return passe(o, null); }), n = actifs(), onglets = '', sel = '';
    var ft = fl.filter(function (d) { return d.m.k === 't'; })[0];
    if (ft) onglets = '<div class="seg" role="tablist" aria-label="Type de formule"><button type="button" role="tab" data-fl="t" data-v="" aria-selected="' + (S.fl.t === '') + '">Tout<span class="cnt">' + ft.tot + '</span></button>' +
      ft.vals.map(function (x) { return '<button type="button" role="tab" data-fl="t" data-v="' + x.v + '" aria-selected="' + (S.fl.t === x.v) + '"' + (x.n === 0 && S.fl.t !== x.v ? ' disabled' : '') + '>' + e(TYPES[x.v]) + '<span class="cnt">' + x.n + '</span></button>'; }).join('') + '</div>';
    var selects = fl.filter(function (d) { return d.m.k !== 't'; });
    if (selects.length) sel = '<div class="flt">' + selects.map(function (d) {
      return '<div class="r-field"><label for="fl-' + d.m.k + '">' + d.m.lab + '</label><span class="r-selectw"><select class="r-select" id="fl-' + d.m.k + '" data-fl="' + d.m.k + '"><option value="">Tous (' + d.tot + ')</option>' +
        d.vals.map(function (x) { return '<option value="' + e(x.v) + '"' + (S.fl[d.m.k] === String(x.v) ? ' selected' : '') + (x.n === 0 && S.fl[d.m.k] !== String(x.v) ? ' disabled' : '') + '>' + e(d.m.txt(x.v)) + ' (' + x.n + ')</option>'; }).join('') + '</select></span></div>';
    }).join('') + '</div>';
    var choix = formule(), masque = choix && !res.some(function (x) { return x.k === choix.k; }) ? '<p class="info" role="status">Choix actuel : ' + e(choix.nom) + ', masqué par les filtres.</p>' : '';
    var lim = S.tout ? 999 : 6, plus = res.length > lim ? '<p style="margin-top:14px"><button type="button" class="r-btn r-btn--sec r-btn--full" data-fl-plus>' + ic('plus', 18) + (res.length - lim > 1 ? 'Voir les ' + (res.length - lim) + ' autres formules' : 'Voir l’autre formule') + '</button></p>' : '';
    var cartes = res.length ? '<div class="fos">' + res.slice(0, lim).map(function (x) {
      return '<button type="button" class="fo" data-f="' + e(x.k) + '" aria-pressed="' + (x.k === S.f) + '"><span class="fh"><span class="nm">' + e(x.nom) + '</span><span class="r-tag">' + TYPES[x.t] + '</span></span>' +
        '<dl class="mt"><div><dt>Format</dt><dd>' + (x.joueurs ? genre(x.joueurs) : '—') + '</dd></div><div><dt>Personnes</dt><dd>' + (x.joueurs || '—') + '</dd></div><div><dt>Durée</dt><dd>' + (x.dOk ? DUR(x.duree) : '—') + '</dd></div><div><dt>Séances</dt><dd>' + (x.ns || '—') + '</dd></div></dl>' +
        '<span class="pp"><span class="pr">' + e(x.pn) + (x.un ? ' <small>' + e(x.un) + '</small>' : '') + '</span><span class="ps">' + e(x.ps) + '</span></span></button>';
    }).join('') + '</div>' : '<div class="vide" role="status"><b>Aucune formule ne correspond</b><span>Aucune formule n’a ces critères à la fois. Retirez un filtre pour voir les autres.</span><button type="button" class="r-btn r-btn--sec r-btn--sm" data-fl-clear>' + ic('x', 18) + 'Tout effacer</button></div>';
    var cmpt = '<span class="cmpt" role="status">' + res.length + ' sur ' + all.length + ' formule' + (all.length > 1 ? 's' : '') + '</span>' + (n ? '<button type="button" class="r-btn r-btn--sec r-btn--sm" data-fl-clear>' + ic('x', 16) + 'Tout effacer</button>' : '');
    return '<div class="bf">' + onglets + '<section class="r-card" aria-label="Formules">' + head('ball', 'Formule', fl.length || all.length > 1 ? cmpt : '') + sel + masque + cartes + plus + '</section></div>';
  }

  function dessine() {
    var d = S.data;
    if (S.etape === 'fait') return fait();
    var f = formule();
    if (!offres().length) { page(d.coach, 'Réserver un cours', '<div class="r-card"><p>Aucun cours n’est réservable pour l’instant.</p></div>'); return; }
    var dispo = f ? d.jours.filter(function (j) { return heures(j, f).length; }) : [];
    /* aucun jour ni horaire choisi d'office ; un jour ou un horaire devenu incohérent est retiré */
    if (S.jour && !dispo.some(function (j) { return j.d === S.jour; })) S.jour = null;
    if (S.pick && S.pick.d !== S.jour) S.pick = null;
    var sport = (d.formules[0] && d.formules[0].sport) || '';
    var sous = 'Coach' + (sport ? ' ' + String(sport).toLowerCase() : '') + ' · ' + d.club;
    if (S.etape === 'infos' && S.pick) { garde(); return infos(f, sous); }
    S.etape = 'choisir';
    var avant = root.querySelector('.bande'), sx = avant ? avant.scrollLeft : 0, sy = window.pageYOffset;
    var de = moisDe(S.w), moisTxt = at(de).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    var vide = (at(de).getDay() + 6) % 7, cases = '', today = iso(new Date());
    for (var v = 0; v < vide; v++) cases += '<span class="dj vide0" aria-hidden="true"></span>';
    if (f) d.jours.forEach(function (j) {
      var n = +j.d.slice(8), h = heures(j, f).length;
      if (h) cases += '<button type="button" class="dj" data-j="' + j.d + '" aria-pressed="' + (j.d === S.jour) + '" aria-label="' + e(jour(j.d)) + ', ' + h + ' créneaux libres"><span class="nb">' + n + '</span><span class="pt"></span></button>';
      else cases += '<span class="dj off"><span class="nb">' + n + '</span>' + (j.libres.length && j.d >= today ? '<small>complet</small>' : '') + '</span>';
    });
    var strip = !f ? '' : dispo.slice(0, 14).map(function (j) {
      var n = heures(j, f).length;
      return '<button type="button" class="dj" data-j="' + j.d + '" aria-pressed="' + (j.d === S.jour) + '"><span class="dw">' + e(jour(j.d, { weekday: 'short' }).replace('.', '')) + '</span><span class="nb">' + +j.d.slice(8) + '</span><small>' + n + ' libre' + (n > 1 ? 's' : '') + '</small></button>';
    }).join('');
    var ouvert = f ? d.jours.filter(function (j) { return j.d === S.jour; })[0] : null, hs = ouvert ? heures(ouvert, f) : [];
    var grp = [{ l: 'Matin', i: 'sun', s: hs.filter(function (t) { return t < 720; }) }, { l: 'Après-midi', i: 'moon', s: hs.filter(function (t) { return t >= 720; }) }].filter(function (g) { return g.s.length; });
    var slots = grp.map(function (g) {
      return '<p class="gl r-etiquette">' + ic(g.i, 18) + '<span>' + g.l + '</span></p><div class="slots">' + g.s.map(function (t) {
        return '<button type="button" class="slot" data-d="' + ouvert.d + '" data-t="' + t + '" aria-pressed="' + !!(S.pick && S.pick.t === t && S.pick.d === ouvert.d) + '">' + H(t) + '</button>';
      }).join('') + '</div>';
    }).join('');
    var nav = '<span class="nav"><button type="button" class="r-ib" id="pv" aria-label="Mois précédent"' + (S.w ? '' : ' disabled') + '>' + ic('left', 18) + '</button><button type="button" class="r-ib" id="nx" aria-label="Mois suivant"' + (S.w < 3 ? '' : ' disabled') + '>' + ic('chev', 18) + '</button></span>';
    var cal = '<div class="cal">' + ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'].map(function (x) { return '<span class="dow">' + x + '</span>'; }).join('') + cases + '</div><p class="leg"><span><i></i>créneaux libres</span><span><i class="p"></i>passé ou complet</span></p>';
    /* la barre du bas guide l'étape : formule, jour, horaire */
    var bas = (S.pick ? '<b>' + e(court(S.pick.d)) + ' · ' + H(S.pick.t) + '</b>' : '<b>' + (!f ? 'Choisissez une formule' : !S.jour ? 'Choisissez un jour' : 'Choisissez un horaire') + '</b>') + (f ? '<small>' + (f.dOk ? DUR(f.duree) + ' · ' : '') + e(prixTxt(f)) + '</small>' : '');
    var choisirF = '<p class="vide-m" role="status">Choisissez d’abord une formule : les jours libres dépendent de sa durée.</p>';
    var jourCarte = '<section class="r-card" aria-label="Jour">' + head('cal', cap(moisTxt), f ? '<button type="button" class="lien mb" id="tm">' + (S.mois ? 'Prochains jours' : 'Tout le mois') + '</button>' + nav : nav) +
      (!f ? choisirF : '<div class="mb">' + (S.mois ? cal : (strip ? '<div class="bande" role="group" aria-label="Jours disponibles">' + strip + '</div>' : '<p class="vide-m">Aucun jour libre ce mois-ci.</p>')) + '</div><div class="dk">' + cal + '</div>') + '</section>';
    var html = entete('Réserver un cours', 'Choisissez votre créneau') +
      '<div class="grille' + (filtres(offres()).some(function (x) { return x.m.k === 't'; }) ? ' tabs-on' : '') + '"><div class="col">' + blocFormules() + jourCarte + '</div>' +
      '<div class="col"><section class="r-card" aria-label="Horaires">' + head('clock', ouvert ? cap(jour(ouvert.d)) : 'Horaire') + (ouvert ? slots : '<p class="vide-m" role="status">' + (!f ? 'Choisissez d’abord une formule, puis un jour.' : !S.jour ? (dispo.length ? 'Choisissez un jour pour voir les horaires.' : 'Aucun créneau libre ce mois-ci : essayez le mois suivant.') : 'Aucun horaire.') + '</p>') + '</section>' +
      '<div class="dk">' + recap(f, 'continuer') + '</div></div></div>' +
      '<div class="bas mb"><div>' + bas + '</div><button type="button" class="r-btn" data-a="suite"' + (S.pick ? '' : ' disabled') + '>' + ic('chev', 18) + 'Continuer</button></div>';
    page(d.coach, sous, html, true);
    var nvb = root.querySelector('.bande'); if (nvb) nvb.scrollLeft = sx;
    window.scrollTo(0, sy);
    root.querySelectorAll('.fo').forEach(function (b) { b.onclick = function () { if (S.f !== b.dataset.f) { S.f = b.dataset.f; S.jour = null; S.pick = null; } dessine(); }; });
    root.querySelectorAll('button[data-fl]').forEach(function (b) { b.onclick = function () { S.fl[b.dataset.fl] = b.dataset.v; S.tout = false; dessine(); }; });
    root.querySelectorAll('[data-fl-plus]').forEach(function (b) { b.onclick = function () { S.tout = true; dessine(); }; });
    root.querySelectorAll('select[data-fl]').forEach(function (s) { s.onchange = function () { S.fl[s.dataset.fl] = s.value; S.tout = false; dessine(); var n = document.getElementById(s.id); if (n && n.focus && !matchMedia('(pointer:coarse)').matches) n.focus(); }; });
    root.querySelectorAll('[data-fl-clear]').forEach(function (b) { b.onclick = function () { S.fl = { t: '', j: '', d: '', s: '', sp: '' }; S.tout = false; dessine(); }; });
    ['pv'].forEach(function (i) { var x = document.getElementById(i); if (x) x.onclick = function () { S.w--; charge(); }; });
    var nx = document.getElementById('nx'); if (nx) nx.onclick = function () { S.w++; charge(); };
    var tm = document.getElementById('tm'); if (tm) tm.onclick = function () { S.mois = !S.mois; dessine(); };
    root.querySelectorAll('button.dj').forEach(function (b) { b.onclick = function () { S.jour = b.dataset.j; S.pick = null; dessine(); }; });
    root.querySelectorAll('.slot').forEach(function (b) { b.onclick = function () { S.pick = { d: b.dataset.d, t: +b.dataset.t }; dessine(); }; });
    root.querySelectorAll('[data-a=suite]').forEach(function (b) { b.onclick = function () { if (!S.pick) return; S.etape = 'infos'; dessine(); window.scrollTo(0, 0); }; });
  }

  function infos(f, sous) {
    var d = S.data, p = S.pick, v = S.v;
    var seg = function (id, lab, data, opts, cur) { return '<div class="r-field w"><span class="lbl" id="' + id + '">' + lab + '<small>facultatif</small></span><div class="r-tabs r-tabs--full" role="group" aria-labelledby="' + id + '">' + opts.map(function (x) { return '<button type="button" data-' + data + '="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div></div>'; };
    var rm = '<div class="r-card rcm mb"><div><b>' + e(court(p.d)) + ' · ' + H(p.t) + '</b><small>' + e(f.nom) + (f.dOk ? ' · ' + DUR(f.duree) : '') + ' · ' + e(prixTxt(f)) + '</small></div><button type="button" class="r-btn r-btn--sec r-btn--sm" data-a="change">' + ic('edit', 18) + 'Changer</button></div>';
    var form = '<form class="r-card" id="f" novalidate>' + head('user', 'Vos informations', '', 'dk') + '<div class="fm">' +
      '<div class="r-field"><label for="p">Prénom</label><input class="r-input" id="p" required autocomplete="given-name" value="' + e(v.p) + '"></div>' +
      '<div class="r-field"><label for="n">Nom</label><input class="r-input" id="n" required autocomplete="family-name" value="' + e(v.n) + '"></div>' +
      '<div class="r-field w"><label for="t">Téléphone</label><input class="r-input" id="t" required type="tel" autocomplete="tel" value="' + e(v.t) + '"></div>' +
      '<div class="r-field w"><label for="em">E-mail</label><input class="r-input" id="em" required type="email" autocomplete="email" value="' + e(v.em) + '"></div>' +
      '<div class="r-field w"><label for="o">Objectif de la séance</label><textarea class="r-textarea" id="o" required rows="2" placeholder="Ce que tu veux travailler">' + e(v.o) + '</textarea></div>' +
      seg('nvl', 'Niveau', 'niv', [['Débutant', 'Débutant'], ['Loisir', 'Loisir'], ['Compétition', 'Compétition']], v.niv) +
      (f.joueurs > 1 ? '<div class="r-field w"><label for="pa">Partenaire' + (f.joueurs > 2 ? 's' : '') + '<small>facultatif</small></label><input class="r-input" id="pa" autocomplete="off" placeholder="' + (f.joueurs > 2 ? 'Prénoms des autres joueurs' : 'Prénom de ton partenaire') + '" value="' + e(v.pa) + '"></div>' : '') +
      seg('cvl', 'Déjà client ?', 'cv', [['abo', 'Je suis abonné(e)'], ['pack', 'J’ai un pack en cours']], v.cv).replace('</div></div>', '</div>' + (v.cv ? '<p class="dg">' + (v.cv === 'abo' ? 'La séance est rattachée à ton abonnement : rien à régler en plus.' : 'La séance est décomptée de ton pack : rien à régler en plus.') + ' ' + e(d.coach) + ' le vérifie.</p>' : '<p class="dg">Si tu as déjà un compte client, ton abonnement est reconnu avec ton e-mail.</p>') + '</div>') +
      '<div class="pot" aria-hidden="true"><label for="site">Site</label><input id="site" tabindex="-1" autocomplete="off"></div>' +
      '<label class="chk w"><input type="checkbox" class="r-check" id="ac" required><span>J’accepte que ' + e(d.coach) + ' conserve ces informations pour organiser mes cours. Je peux demander leur suppression à tout moment.</span></label>' +
      '<div class="w"><button class="r-btn r-btn--full" id="go" type="submit">' + ic('check', 18) + 'Réserver mon cours</button></div><p class="err w" id="er" role="alert"></p></div></form>';
    var corps = titre('Étape 4 sur 4', 'Vos informations') + '<ol class="steps" aria-label="Étapes">' + ['Formule', 'Jour', 'Horaire', 'Vos infos'].map(function (x, i) { return '<li class="' + (i < 3 ? 'ok' : 'on') + '"' + (i === 3 ? ' aria-current="step"' : '') + '>' + (i < 3 ? ic('check', 14) : '4 ·') + ' ' + x + '</li>'; }).join('') + '</ol>' +
      '<div class="grille"><div class="col">' + rm + form + '</div><div class="col dk">' + recap(f, 'infos') + '</div></div>';
    page(d.coach, sous, corps);
    root.querySelectorAll('[data-a=change]').forEach(function (b) { b.onclick = function () { garde(); S.etape = 'choisir'; dessine(); window.scrollTo(0, 0); }; });
    root.querySelectorAll('[data-cv]').forEach(function (b) { b.onclick = function () { garde(); S.v.cv = S.v.cv === b.dataset.cv ? '' : b.dataset.cv; infos(f, sous); }; });
    root.querySelectorAll('[data-niv]').forEach(function (b) { b.onclick = function () { garde(); S.v.niv = S.v.niv === b.dataset.niv ? '' : b.dataset.niv; infos(f, sous); }; });
    var fm = document.getElementById('f');
    fm.onsubmit = function (x) {
      x.preventDefault();
      garde();
      if (!fm.checkValidity()) { fm.reportValidity(); return; }
      var bt = document.getElementById('go'), val = function (i) { return document.getElementById(i).value; };
      bt.disabled = true;
      post('/api/public/resa/reserver', { c: c, k: k, d: p.d, t: p.t, formule: f.id, type: f.t, couvert: S.v.cv, partenaires: S.v.pa, prenom: val('p'), nom: val('n'), tel: val('t'), email: val('em'), objectif: val('o'), niveau: S.v.niv, site: val('site'), accord: document.getElementById('ac').checked })
        .then(function (r) { S.conf = { r: r, f: f, p: p }; S.etape = 'fait'; dessine(); window.scrollTo(0, 0); })
        .catch(function (z) { bt.disabled = false; document.getElementById('er').textContent = z.message; });
    };
  }

  function ics(co) {
    var p = co.p, f = co.f, dt = function (t) { return p.d.replace(/-/g, '') + 'T' + String(Math.floor(t / 60)).padStart(2, '0') + String(t % 60).padStart(2, '0') + '00'; };
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dojo//reservation//FR', 'BEGIN:VEVENT', 'UID:' + co.r.id + '@dojo', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + dt(p.t), 'DTEND:' + dt(p.t + f.duree),
      'SUMMARY:' + (f.nom + ' avec ' + co.r.coach).replace(/[,;\n]/g, ' '), 'LOCATION:' + String(S.data.club).replace(/[,;\n]/g, ' '), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  }

  function fait() {
    var d = S.data, co = S.conf, r = co.r, f = co.f, p = co.p, lim = new Date(at(p.d).setHours(0, p.t, 0, 0) - 864e5);
    var limTxt = lim.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' à ' + H(lim.getHours() * 60 + lim.getMinutes());
    var sport = (d.formules[0] && d.formules[0].sport) || '';
    page(d.coach, 'Coach' + (sport ? ' ' + String(sport).toLowerCase() : '') + ' · ' + d.club,
      '<div class="fin"><div class="ok">' + ic('check', 40) + '</div>' +
      '<div><h2 style="margin:0;font:400 32px/1.05 var(--f-display);text-transform:uppercase">C’est réservé</h2><p class="tx">Un e-mail de confirmation est parti à ' + e(r.mail) + '. ' + e(d.coach) + ' est prévenu.</p></div>' +
      '<section class="r-card cc"><p class="r-etiquette" style="color:var(--c-muted)">Votre cours</p><p class="jr">' + e(jour(r.d)) + '</p>' +
      '<p class="li">' + ic('clock', 18) + '<span>' + H(p.t) + ' – ' + H(p.t + f.duree) + ' · ' + e(String(f.nom).toLowerCase()) + '</span></p>' +
      '<p class="li">' + ic('pin', 18) + '<span>' + e(d.club) + '</span></p><hr class="hr" style="margin:4px 0">' +
      '<p class="tot"><span>' + (r.couvert ? (r.couvert === 'abo' ? 'Rattaché à ton abonnement' : 'Décompté de ton pack') : 'À régler sur place') + '</span><b>' + e(r.couvert ? 'Inclus' : f.pn + (f.un ? ' ' + f.un : '')) + '</b></p></section>' +
      '<div class="btn-b"><a class="r-btn r-btn--full" id="ag" download="cours.ics" href="#">' + ic('cal', 18) + 'Ajouter à mon agenda</a>' +
      '<button type="button" class="r-btn r-btn--sec r-btn--full" id="enc">' + ic('plus', 18) + 'Réserver un autre cours</button>' +
      '<div><a class="r-btn r-btn--sec r-btn--full" href="' + e(r.annuler) + '">' + ic('x', 18) + 'Annuler mon cours</a><p class="ann">Annulation gratuite jusqu’au ' + e(limTxt) + '.</p></div></div></div>');
    document.getElementById('ag').onclick = function () { this.href = URL.createObjectURL(new Blob([ics(co)], { type: 'text/calendar' })); };
    document.getElementById('enc').onclick = function () { S.etape = 'choisir'; S.pick = null; S.conf = null; S.v.o = ''; charge(); window.scrollTo(0, 0); };
  }
  charge();
})();
</script>
</body>
</html>
