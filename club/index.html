<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAM Club</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAM Club">
<meta name="theme-color" content="#0B0B0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ram.css">
<style>@media (max-width:480px){.phone{padding-bottom:env(safe-area-inset-bottom)}}</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="top" id="top"></div>
  <div id="main"></div>
  <div class="foot" id="foot" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
  <div id="layer"></div>
  <div class="ram-splash" id="ramSplash" aria-hidden="true"><img src="img/ram-club-blanc.png" alt=""></div>
</div>
<script src="logo.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="sons.js"></script>
<script src="trophees.js"></script>
<script src="app.js"></script>
<script src="ram-sync.js"></script>
<script>
/* Service worker : appli hors connexion + notifications push (voir sw.js). Sans support, l'appli marche normalement. */
/* écran de lancement /RAM Club : retiré dès que l'appli est prête */
/* il attend aussi le chargement du club (4 s au plus) pour ne pas montrer la démo avant le vrai club */
Promise.all([new Promise(r=>setTimeout(r,700)),Promise.race([window.ramReady||Promise.resolve(),new Promise(r=>setTimeout(r,4000))])]).then(()=>{const s=document.getElementById('ramSplash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),400)}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
