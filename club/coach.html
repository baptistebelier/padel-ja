<script>/* refonte du style : ?ds=1 essaie la nouvelle feuille (?ds=0 revient à l ancienne) */(function(){var q=location.search.match(/[?&]ds=([01])/);try{if(q)localStorage.setItem("dojo-ds",q[1])}catch(e){}var on=q?q[1]==="1":(function(){try{return localStorage.getItem("dojo-ds")!=="0"}catch(e){return false}})();document.documentElement.dataset.ds=on?"1":"0";document.write(on?"<link rel=stylesheet href=ds.css><link rel=stylesheet href=dojo.css>":"<link rel=stylesheet href=app.css><link rel=stylesheet href=ram.css><link rel=stylesheet href=coach/coach.css><link rel=stylesheet href=coach/dojo.css>")})()</script>
<script>/* nouvelle organisation de /Dojo : affichée par défaut depuis le 14/11/2026 ; ?ui=1 revient à l'ancienne en secours (choix mémorisé sur l'appareil, ?ui=2 y revient) */(function(){var q=location.search.match(/[?&]ui=([12])/);try{localStorage.removeItem("dojo-ui");if(q)localStorage.setItem("dojo-ui-defaut",q[1])}catch(e){}var v=q?q[1]:(function(){try{return localStorage.getItem("dojo-ui-defaut")||"2"}catch(e){return "2"}})();document.documentElement.dataset.ui=v==="2"?"2":"1";if(v==="2")document.write("<link rel=stylesheet href=dojo-ui2.css>")})()</script>

<script>
/* Service worker : appli hors connexion + notifications push (voir sw.js). Sans support, l'appli marche normalement. */
/* écran de lancement /RAM Coach : retiré dès que l'appli est prête */
/* il attend aussi le chargement du club (4 s au plus) pour ne pas montrer la démo avant le vrai club */
Promise.all([new Promise(r=>setTimeout(r,700)),Promise.race([window.ramReady||Promise.resolve(),new Promise(r=>setTimeout(r,4000))])]).then(()=>{const s=document.getElementById('ramSplash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),400)}});
/* Mises à jour : l'appli vérifie s'il existe une nouvelle version à chaque retour au premier plan, et se recharge d'elle-même dès qu'elle est installée (une fois, jamais pendant une saisie) */
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;const go=()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){setTimeout(go,4000);return}location.reload()};go()});
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?app=coach').then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{}))}
</script>
<script>/* filet de sécurité : si l'appli n'a pas démarré au bout de 10 s (écran blanc, ancienne version gardée sur l'appareil), un bouton vide sa mémoire et la recharge */setTimeout(function f(){if(document.readyState!=="complete")return setTimeout(f,3000);var m=document.getElementById("main");if(m&&m.children.length)return;var d=document.createElement("div");d.setAttribute("role","alert");d.style.cssText="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#F4EFE6;color:#1A0A10;font:16px/1.4 system-ui,sans-serif;text-align:center";d.innerHTML="<b style=\"font-size:20px\">L’appli n’a pas pu démarrer</b><span>Une ancienne version est peut-être restée sur cet appareil.</span><button type=\"button\" style=\"font:600 16px system-ui,sans-serif;padding:14px 22px;border:2px solid #1A0A10;background:#E5F909;color:#1A0A10;box-shadow:4px 4px 0 #1A0A10;cursor:pointer\">Recharger l’appli</button>";d.querySelector("button").onclick=function(){var t=[];if("serviceWorker" in navigator)t.push(navigator.serviceWorker.getRegistrations().then(function(l){return Promise.all(l.map(function(r){return r.unregister()}))}));if(window.caches)t.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));Promise.all(t).catch(function(){}).then(function(){location.reload()})};document.body.appendChild(d)},10000)</script>
